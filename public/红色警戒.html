</style></head><body>

<script>
var MW=4000,MH=3000,T=40,PI=Math.PI;
var SIDES=[
  {n:'🇨🇳中国',fl:'🇨🇳',c:'#ff2222',dk:'#6a1a1a',lt:'#ff8866',wh:'#ffddcc'},
  {n:'🇺🇸美国',fl:'🇺🇸',c:'#2266cc',dk:'#1a3a6a',lt:'#66aaff',wh:'#ddeeff'},
  {n:'🇰🇷韩国',fl:'🇰🇷',c:'#22cc44',dk:'#1a5a2a',lt:'#66ff88',wh:'#ccffdd'},
  {n:'🇯🇵日本',fl:'🇯🇵',c:'#dddddd',dk:'#888888',lt:'#ffffff',wh:'#ffffff'}
];
var BD={
  hq:{n:'基地',g:0,hp:2000,ic:'🏛️',sz:3,rq:null,gn:0,us:0},
  power:{n:'电厂',g:300,hp:400,ic:'⚡',sz:2,rq:'hq',gn:100,us:0},
  refinery:{n:'矿场',g:500,hp:600,ic:'⛏️',sz:2,rq:'power',gn:0,us:30},
  barracks:{n:'兵营',g:400,hp:500,ic:'🏠',sz:2,rq:'refinery',gn:0,us:20},
  warfactory:{n:'战车工厂',g:800,hp:800,ic:'🏭',sz:3,rq:'barracks',gn:0,us:40},
  turret:{n:'机枪塔',g:300,hp:500,ic:'🔫',sz:1,rq:'barracks',gn:0,us:10},
  missile:{n:'导弹塔',g:500,hp:700,ic:'🚀',sz:1,rq:'warfactory',gn:0,us:20},
  wall:{n:'围墙',g:50,hp:200,ic:'🧱',sz:1,rq:'hq',gn:0,us:0},
  lab:{n:'实验室',g:600,hp:500,ic:'🔬',sz:2,rq:'power',gn:0,us:30},
  bridge:{n:'桥梁',g:400,hp:800,ic:'🌉',sz:2,rq:'refinery',gn:0,us:0},
  tunnel:{n:'地道入口',g:500,hp:600,ic:'🕳️',sz:2,rq:'refinery',gn:0,us:0},
  nukesilo:{n:'核弹发射井',g:3000,hp:1500,ic:'☢️',sz:3,rq:'lab',gn:0,us:80},
};
var UD={
  rifle:{n:'步枪兵',g:100,hp:80,atk:8,spd:1.4,rng:100,rt:25,ar:'lt',rq:'barracks',ex:0,mx:100},
  rocket:{n:'火箭兵',g:200,hp:60,atk:35,spd:1.1,rng:150,rt:60,ar:'lt',rq:'barracks',ex:0,mx:100},
  engineer:{n:'工程师',g:300,hp:50,atk:0,spd:1.2,rng:30,rt:0,ar:'lt',rq:'barracks',ex:0,mx:100},
  light:{n:'轻型坦克',g:500,hp:350,atk:20,spd:1.6,rng:130,rt:40,ar:'hv',rq:'warfactory',ex:0,mx:200},
  heavy:{n:'重型坦克',g:900,hp:800,atk:40,spd:1.0,rng:150,rt:55,ar:'hv',rq:'warfactory',ex:0,mx:300},
  artillery:{n:'火炮',g:700,hp:200,atk:70,spd:0.7,rng:280,rt:120,ar:'hv',rq:'warfactory',ex:0,mx:250},
  heli:{n:'武装直升机',g:1200,hp:300,atk:50,spd:2.0,rng:180,rt:50,ar:'air',rq:'warfactory',ex:0,mx:150},
  hero:{n:'英雄指挥官',g:2500,hp:2500,atk:80,spd:1.5,rng:160,rt:35,ar:'hv',rq:'lab',ex:0,mx:500}
};
function unitCost(d,side){
  side=(side===undefined)?mySide:side;
  var cnt=blds.filter(function(b){return b.type===d.rq&&b.side===side&&b.hp>0;}).length;
  return Math.floor(d.g*(1-Math.min(0.6,(cnt-1)*0.15)));
}
function techUnlocked(id,side){
  if(id==='heavy'||id==='artillery'||id==='heli'||id==='hero')
    return blds.some(function(b){return b.type==='lab'&&b.side===side&&b.hp>0;});
  if(id==='nukesilo')
    return blds.some(function(b){return b.type==='lab'&&b.side===side&&b.hp>0;});
  return true;
}
var bldImgs={};
function loadBldImgs(){
  Object.keys(BD).forEach(function(k){
    var img=new Image();
    img.onload=function(){img._ok=1;};
    img.onerror=function(){img._ok=0;};
    img.src='assets/buildings/'+k+'.png?'+Date.now();
    bldImgs[k]=img;
  });
}
function getBldImg(type,side){
  var sideImg=bldImgs[type+'_'+side];
  if(sideImg&&sideImg._ok)return sideImg;
  var img=bldImgs[type];
  if(img&&img._ok)return img;
  return null;
}
function drawBldImg(img,b,sp,sz,col){
  var w=sz*2*1.05,h=sz*2*1.05;
  if(!drawBldImg._cache)drawBldImg._cache={};
  var key=img.src+'|'+col;
  var cached=drawBldImg._cache[key];
  if(cached&&cached.width>0){
    cx.drawImage(cached,sp.x-sz*1.05,sp.y-sz*1.05,w,h);
    return;
  }
  var oc=document.createElement('canvas');
  var ow=img.naturalWidth||img.width||1,oh=img.naturalHeight||img.height||1;
  oc.width=ow;oc.height=oh;
  var ox=oc.getContext('2d');
  ox.drawImage(img,0,0);
  ox.globalCompositeOperation='source-atop';
  ox.globalAlpha=0.32;
  ox.fillStyle=col;
  ox.fillRect(0,0,ow,oh);
  drawBldImg._cache[key]=oc;
  cx.drawImage(oc,sp.x-sz*1.05,sp.y-sz*1.05,w,h);
}

var cv=document.getElementById('c'),cx=cv.getContext('2d');
var mm=document.getElementById('minimap'),mx2=mm.getContext('2d');
var W,H;
var camX=0,camY=0,camZ=1.5;
var sideGold=[5000,5000,5000,5000];
var gold=5000,pwr=0,pwrU=0;
var gt=0,gOver=0,gOn=0;
var blds=[],units=[],bullets=[],parts=[],ores=[],miners=[];
var selU=[],selB=null,bldMode=null,bldX=0,bldY=0;
var mdn=false,dsx=0,dsy=0,isDrag=false,sBox=null;
var mpx=0,mpy=0;
var mData=[];
var ais=[null,null,null,null];
var mType='symmetric';
var mySide=0;
var humanSide=[true,false,false,false];
var _eid=1;
function isHumanSide(s){return !!humanSide[s];}
var weather='clear';
var weatherTimer=1800;
var supplies=[];
var supplyTimer=2400;
var nukeStates={0:null,1:null,2:null,3:null};
var nukes=[];
var nukeFx=[];
var screenFlash=0;

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;mm.width=160;mm.height=120;}
resize();onresize=resize;

function handleMapUpload(e){
  var file=e.target.files[0];if(!file)return;
  document.getElementById('mapname').textContent='⏳ 加载中...';
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var cols=Math.ceil(MW/T),rows=Math.ceil(MH/T);
        var tmpCv=document.createElement('canvas');tmpCv.width=cols;tmpCv.height=rows;
        var tmpCtx=tmpCv.getContext('2d');
        tmpCtx.drawImage(img,0,0,cols,rows);
        var px=tmpCtx.getImageData(0,0,cols,rows);
        mType='custom';
        document.getElementById('map-sel').value='custom';
        document.getElementById('mapname').textContent='📷 '+file.name;
        mData=[];
        for(var y=0;y<rows;y++){mData[y]=[];for(var x=0;x<cols;x++){
          var i=(y*cols+x)*4;
          var r=px.data[i],g=px.data[i+1],b=px.data[i+2];
          mData[y][x]=colorToTerrain(r,g,b);
        }}
        ores=[];blds=[];units=[];bullets=[];parts=[];miners=[];
        selU=[];selB=null;bldMode=null;
        sideGold=[5000,5000,5000,5000];gold=5000;pwr=0;pwrU=0;
        gt=0;gOver=0;gOn=1;
        weather='clear';weatherTimer=1800;supplies=[];supplyTimer=2400;
        ais=[null,null,null,null];
        var strategies=['infantry','armor','turtle'];
        for(var a2=1;a2<=3;a2++){ais[a2]={timer:1800+~~(Math.random()*1200),wave:0,bt:400,ut:200,strategy:strategies[a2-1],atkOn:false,atkSide:null,raidCd:600};}
        ais[0]={timer:1800+~~(Math.random()*1200),wave:0,bt:400,ut:200,strategy:strategies[~~(Math.random()*3)],atkOn:false,atkSide:null,raidCd:600};
        placeOres();placeBases();
        var _h=cornerOf(mySide);camX=_h.x-W/2/camZ;camY=_h.y-H/2/camZ;
        buildPanels();
      }catch(err){
        document.getElementById('mapname').textContent='❌ 转换失败: '+err.message;
      }
    };
    img.onerror=function(){document.getElementById('mapname').textContent='❌ 图片加载失败';};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function colorToTerrain(r,g,b){
  if(b>120&&b>r+30&&b>g+30) return 3;
  if(r>180&&g>180&&b>180&&Math.abs(r-g)<40&&Math.abs(g-b)<40) return 5;
  if(r<80&&g<80&&b<80) return 4;
  if(g>r+20&&g>b+20&&g>80&&r<100) return 2;
  if(r>150&&g>120&&b<100&&r>g) return 1;
  return 0;
}

function genMap(){
  var isCustom=mType==='custom'&&mData.length>0;
  if(!isCustom)mData=[];ores=[];blds=[];units=[];bullets=[];parts=[];miners=[];
  selU=[];selB=null;bldMode=null;
  sideGold=[5000,5000,5000,5000];gold=5000;pwr=0;pwrU=0;
  gt=0;gOver=0;gOn=1;
  weather='clear';weatherTimer=1800;supplies=[];supplyTimer=2400;nukeStates={0:null,1:null,2:null,3:null};
  nukes=[];nukeFx=[];screenFlash=0;
  ais=[null,null,null,null];
  var strategies=['infantry','armor','turtle'];
  for(var i=1;i<=3;i++){ais[i]={timer:1800+~~(Math.random()*1200),wave:0,bt:400,ut:200,strategy:strategies[i-1]||strategies[~~(Math.random()*3)],atkOn:false,atkSide:null,raidCd:600};}
  ais[0]={timer:1800+~~(Math.random()*1200),wave:0,bt:400,ut:200,strategy:strategies[~~(Math.random()*3)],atkOn:false,atkSide:null,raidCd:600};
  var cols=Math.ceil(MW/T),rows=Math.ceil(MH/T);
  if(!isCustom){
    for(var y=0;y<rows;y++){mData[y]=[];for(var x=0;x<cols;x++)mData[y][x]=0;}
    if(mType==='symmetric')genSym(cols,rows);
    else if(mType==='lanes')genLanes(cols,rows);
    else if(mType==='open')genOpen(cols,rows);
    else genFort(cols,rows);
  }
  placeOres();placeBases();
  var _h=cornerOf(mySide);camX=_h.x-W/2/camZ;camY=_h.y-H/2/camZ;
  if(mType!=='custom')document.getElementById('mapname').textContent={symmetric:'对称竞技',lanes:'战术三路',open:'开阔战场',fortress:'据点争夺'}[mType];
  buildPanels();
}
function genSym(c,r){
  for(var y=0;y<r;y++)for(var x=0;x<c;x++){
    var nx=x/c,ny=y/r;
    if(nx<0.06||nx>0.94||ny<0.05||ny>0.95)mData[y][x]=3;
    if(nx<0.18&&ny<0.18&&Math.random()<0.35)mData[y][x]=4;
    if(nx>0.82&&ny<0.18&&Math.random()<0.35)mData[y][x]=4;
    if(nx<0.18&&ny>0.82&&Math.random()<0.35)mData[y][x]=4;
    if(nx>0.82&&ny>0.82&&Math.random()<0.35)mData[y][x]=4;
    if(Math.abs(ny-0.5)<0.07&&nx>0.15&&nx<0.85&&Math.random()<0.25)mData[y][x]=4;
    if(Math.abs(nx-0.35)<0.07&&Math.abs(ny-0.3)<0.1&&Math.random()<0.35)mData[y][x]=2;
    if(Math.abs(nx-0.65)<0.07&&Math.abs(ny-0.7)<0.1&&Math.random()<0.35)mData[y][x]=2;
    if(Math.abs(nx-0.5)<0.12&&Math.abs(ny-0.5)<0.08)mData[y][x]=1;
  }
}
function genLanes(c,r){
  for(var y=0;y<r;y++)for(var x=0;x<c;x++){
    var nx=x/c,ny=y/r;
    if(nx<0.05||nx>0.95||ny<0.04||ny>0.96)mData[y][x]=3;
    var r1=Math.abs(ny-0.33)<0.035,r2=Math.abs(ny-0.66)<0.035;
    if((r1||r2)&&nx>0.08&&nx<0.92){mData[y][x]=3;if(Math.abs(nx-0.25)<0.025||Math.abs(nx-0.5)<0.025||Math.abs(nx-0.75)<0.025)mData[y][x]=5;}
    if((r1||r2)&&Math.random()<0.12)mData[y][x]=4;
    if(Math.random()<0.05&&mData[y][x]===0)mData[y][x]=2;
  }
}
function genOpen(c,r){
  for(var y=0;y<r;y++)for(var x=0;x<c;x++){
    var nx=x/c,ny=y/r;
    if(nx<0.04||nx>0.96||ny<0.04||ny>0.96)mData[y][x]=3;

function tileAt(wx,wy){
  var tx=~~(wx/T),ty=~~(wy/T);
  if(ty<0||ty>=mData.length||tx<0||tx>=mData[0].length)return 3;
  return mData[ty][tx];
}
function passable(wx,wy){
  var t=tileAt(wx,wy);
  if(t===3||t===4){
    var tx=~~(wx/T),ty=~~(wy/T);
    var onBridge=blds.some(function(b){return b.type==='bridge'&&b.hp>0&&Math.abs(b.x-(tx*T+T/2))<b.sz*T&&Math.abs(b.y-(ty*T+T/2))<b.sz*T;});
    if(!onBridge)return false;
  }
  for(var i=0;i<blds.length;i++){var b=blds[i],bs=b.sz*T/2;if(Math.abs(b.x-wx)<bs&&Math.abs(b.y-wy)<bs)return false;}

}
function tSpd(wx,wy){var t=tileAt(wx,wy);var s=t===2?0.7:t===5?1.4:t===1?0.9:1;if(weather==='rain')s*=0.5;return s;}

var _pc={};
function tileBlockedByBld(gx,gy,allowGoal,tgx,tgy){
  if(allowGoal&&gx===tgx&&gy===tgy)return false;
  var wx=gx*T+T/2,wy=gy*T+T/2;
  for(var i=0;i<blds.length;i++){
    var b=blds[i];
    if(b.hp<=0||b.type==='bridge')continue;
    var bs=b.sz*T/2+4;
    if(Math.abs(b.x-wx)<bs&&Math.abs(b.y-wy)<bs)return true;

function findPath(sx,sy,tx,ty){
  var sgx=~~(sx/T),sgy=~~(sy/T),tgx=~~(tx/T),tgy=~~(ty/T);
  if(sgx===tgx&&sgy===tgy)return null;
  if(tgy<0||tgy>=mData.length||tgx<0||tgx>=mData[0].length)return null;
  if(tileBlockedByBld(tgx,tgy,true,tgx,tgy)){
    var found=false;
    for(var rad=1;rad<=3&&!found;rad++){
      for(var dy=-rad;dy<=rad&&!found;dy++)for(var dx=-rad;dx<=rad&&!found;dx++){
        if(Math.abs(dx)!==rad&&Math.abs(dy)!==rad)continue;
        var cxg=tgx+dx,cyg=tgy+dy;
        if(cyg<0||cyg>=mData.length||cxg<0||cxg>=mData[0].length)continue;
        if(!tileBlockedByBld(cxg,cyg,false,tgx,tgy)&&mData[cyg][cxg]!==3&&mData[cyg][cxg]!==4){
          tgx=cxg;tgy=cyg;found=true;
        }
      }
    }
    if(!found)return null;
  }
  var tk=sgx+','+sgy+'->'+tgx+','+tgy;
  if(_pc[tk]&&_pc[tk].t>gt)return _pc[tk].p;
  var op=[{x:sgx,y:sgy,g:0,f:0}],cl={},fr={},gs={};
  gs[sgx+','+sgy]=0;
  var dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1},{dx:1,dy:1},{dx:-1,dy:1},{dx:1,dy:-1},{dx:-1,dy:-1}];
  var fd=false,it=0;
  while(op.length>0&&it<600){
    it++;var bi=0;
    for(var i=1;i<op.length;i++)if(op[i].f<op[bi].f)bi=i;
    var cu=op.splice(bi,1)[0],ck=cu.x+','+cu.y;
    if(cu.x===tgx&&cu.y===tgy){fd=true;break;}
    if(cl[ck])continue;cl[ck]=1;
    for(var d=0;d<8;d++){
      var nx=cu.x+dirs[d].dx,ny=cu.y+dirs[d].dy,nk=nx+','+ny;
      if(cl[nk])continue;
      if(ny<0||ny>=mData.length||nx<0||nx>=mData[0].length)continue;
      var t=mData[ny][nx];if(t===3||t===4){
        var bx=nx*T+T/2,by=ny*T+T/2;
        var bridgeOk=blds.some(function(bb){return bb.type==='bridge'&&bb.hp>0&&Math.abs(bb.x-bx)<bb.sz*T&&Math.abs(bb.y-by)<bb.sz*T;});
        if(!bridgeOk)continue;
      }
      if(tileBlockedByBld(nx,ny,nx===tgx&&ny===tgy,tgx,tgy))continue;
      if(dirs[d].dx&&dirs[d].dy){
        var a=mData[cu.y]?mData[cu.y][cu.x+dirs[d].dx]:4;
        var b=mData[cu.y+dirs[d].dy]?mData[cu.y+dirs[d].dy][cu.x]:4;
        if(a===3||a===4||b===3||b===4){
          var okDiag=blds.some(function(bb){return bb.type==='bridge'&&bb.hp>0&&Math.abs(bb.x-bx)<bb.sz*T&&Math.abs(bb.y-by)<bb.sz*T;});
          if(!okDiag)continue;
        }
        if(tileBlockedByBld(cu.x+dirs[d].dx,cu.y,false,tgx,tgy)||tileBlockedByBld(cu.x,cu.y+dirs[d].dy,false,tgx,tgy))continue;
      }
      var ng=(gs[ck]||0)+(dirs[d].dx&&dirs[d].dy?1.41:1);
      if(gs[nk]===undefined||ng<gs[nk]){
        gs[nk]=ng;fr[nk]=ck;
        var h=Math.abs(tgx-nx)+Math.abs(tgy-ny);
        var ex=false;for(var j=0;j<op.length;j++){if(op[j].x===nx&&op[j].y===ny){ex=true;break;}}
        if(!ex)op.push({x:nx,y:ny,g:ng,f:ng+h});
      }
    }
  }
  if(!fd){_pc[tk]={p:null,t:gt+45};return null;}
  var path=[],ck=tgx+','+tgy;
  while(fr[ck]){var pp=ck.split(',');path.unshift({x:(~~pp[0]+0.5)*T,y:(~~pp[1]+0.5)*T});ck=fr[ck];}
  path.push({x:tx,y:ty});
  _pc[tk]={p:path,t:gt+90};return path;
}
function wallFollow(o,tx,ty,spd){
  var toT=Math.atan2(ty-o.y,tx-o.x);
  var side=o._wfSide||1;
  var cand=[
    toT+side*PI/2,toT-side*PI/2,
    toT+side*PI/2*0.6,toT-side*PI/2*0.6,
    toT+PI*0.75,toT-PI*0.75,
    toT+side*PI*0.45,toT-side*PI*0.45
  ];
  var sp=spd*tSpd(o.x,o.y);
  for(var i=0;i<cand.length;i++){
    var nx=o.x+Math.cos(cand[i])*sp*1.4,ny=o.y+Math.sin(cand[i])*sp*1.4;
    if(passable(nx,ny)){o.x=nx;o.y=ny;o._path=null;o._pi=0;return true;}
  }
  if((o._wfCount=(o._wfCount||0)+1)>20){
    o._wfSide=side*-1;o._wfCount=0;o._path=null;
    var ang=Math.random()*PI*2;
    for(var a=0;a<8;a++){
      var ta=ang+a*PI/4,tx2=o.x+Math.cos(ta)*T,ty2=o.y+Math.sin(ta)*T;
      if(passable(tx2,ty2)){o.x=tx2;o.y=ty2;break;}
    }
  }
  return false;
}
function moveTow(o,tx,ty,spd){
  var dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  if(d<3)return true;
  if(!passable(o.x,o.y)){
    var ang=Math.random()*PI*2;
    for(var a=0;a<8;a++){
      var ta=ang+a*PI/4,tx2=o.x+Math.cos(ta)*T*0.7,ty2=o.y+Math.sin(ta)*T*0.7;
      if(passable(tx2,ty2)){o.x=tx2;o.y=ty2;o._path=null;return false;}
    }
    return false;
  }
  var lastX=o._lx===undefined?o.x:o._lx,lastY=o._ly===undefined?o.y:o._ly;
  var movedDist=Math.hypot(o.x-lastX,o.y-lastY);
  o._lx=o.x;o._ly=o.y;
  if(movedDist<0.15)o._stuckN=(o._stuckN||0)+1;else o._stuckN=0;
  if(o._stuckN>18){
    o._stuckN=0;o._path=null;o._pi=0;
    if(o._wfSide===undefined)o._wfSide=Math.random()<0.5?1:-1;
    wallFollow(o,tx,ty,spd);
    if(movedDist<0.15){
      var ang0=Math.random()*PI*2;
      for(var a0=0;a0<8;a0++){
        var ta0=ang0+a0*PI/4,ex=o.x+Math.cos(ta0)*T*1.2,ey=o.y+Math.sin(ta0)*T*1.2;
        if(passable(ex,ey)){o.x=ex;o.y=ey;break;}
      }
    }
    return false;
  }
  if(!o._path||o._pi===undefined||o._stuckN>8||Math.random()<0.01){
    var p=findPath(o.x,o.y,tx,ty);
    if(p&&p.length>0){o._path=p;o._pi=0;}
    else{o._path=null;}
  }
  var step=null;
  if(o._path&&o._pi<o._path.length){
    var wp=o._path[o._pi];
    if(Math.hypot(wp.x-o.x,wp.y-o.y)<18)o._pi++;
    if(o._pi<o._path.length)step=o._path[o._pi];
  }
  var moved=false;
  if(step){
    var ndx=step.x-o.x,ndy=step.y-o.y,nd=Math.hypot(ndx,ndy);
    if(nd>2){
      var sp=spd*tSpd(o.x,o.y),nx=o.x+ndx/nd*sp,ny=o.y+ndy/nd*sp;
      if(passable(nx,ny)){o.x=nx;o.y=ny;moved=true;}
      else if(passable(nx,o.y)&&passable(o.x,ny)){o.x=nx;o.y=ny;moved=true;}
      else if(passable(nx,o.y)){o.x=nx;moved=true;}
      else if(passable(o.x,ny)){o.y=ny;moved=true;}
      else{wallFollow(o,tx,ty,spd);moved=true;}
    }else{o._pi++;}
  }else{
    var sp2=spd*tSpd(o.x,o.y),nx2=o.x+dx/d*sp2,ny2=o.y+dy/d*sp2;
    if(passable(nx2,ny2)){o.x=nx2;o.y=ny2;moved=true;}
    else if(passable(nx2,o.y)&&passable(o.x,ny2)){o.x=nx2;o.y=ny2;moved=true;}
    else if(passable(nx2,o.y)){o.x=nx2;moved=true;}
    else if(passable(o.x,ny2)){o.y=ny2;moved=true;}
    else{wallFollow(o,tx,ty,spd);moved=true;}
  }
  if(!moved)wallFollow(o,tx,ty,spd);
  if(moved&&Math.hypot(tx-o.x,ty-o.y)<12){o._stuckN=0;o._wfCount=0;}
  return false;
}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function findTgt(u,rng){
  var best=null,bd=rng;
  var all=units.filter(function(e){return e.side!==u.side&&e.hp>0;})
    .concat(miners.filter(function(e){return e.side!==u.side&&e.hp>0;}))
    .concat(blds.filter(function(e){return e.side!==u.side&&e.hp>0;}));
  if(u.wSide!==undefined){
    for(var i=0;i<all.length;i++){
      if(all[i].side!==u.wSide)continue;
      var d2=dist(u,all[i]);
      if(all[i].type==='hq')d2*=0.25;
      else if(all[i].type==='refinery')d2*=0.45;
      else if(all[i].type==='turret'||all[i].type==='missile')d2*=0.75;
      if(d2<bd){bd=d2;best=all[i];}
    }
    if(best)return best;
  }
  for(var i=0;i<all.length;i++){
    var d=dist(u,all[i]);
    if(all[i].type==='hq')d*=0.5;
    else if(all[i].type==='refinery')d*=0.7;
    if(d<bd){bd=d;best=all[i];}
  }
  return best;
}
function sidePower(side){
  if(!blds.some(function(b){return b.type==='hq'&&b.side===side&&b.hp>0;}))return 1e12;
  var army=units.filter(function(u){return u.side===side&&u.hp>0;});
  var armyVal=0;
  for(var i=0;i<army.length;i++){var dd=UD[army[i].type];if(dd)armyVal+=dd.g*(1+(army[i].lv||0)*0.35);}
  var bVal=0;
  blds.forEach(function(b){if(b.side===side&&b.hp>0){var bd=BD[b.type];if(bd)bVal+=bd.g*0.4;}});
  var hq=blds.find(function(b){return b.type==='hq'&&b.side===side&&b.hp>0;});
  var hqVal=hq?hq.hp*2:0;
  return armyVal+bVal+hqVal+sideGold[side]*0.4;
}
function pickWeakTarget(side){
  var enemies=[];
  for(var s=0;s<4;s++){
    if(s===side)continue;
    if(blds.some(function(b){return b.type==='hq'&&b.side===s&&b.hp>0;}))enemies.push(s);
  }
  if(!enemies.length)return null;
  enemies.sort(function(a,b){return sidePower(a)-sidePower(b);});
  var r=Math.random();
  if(r<0.65||enemies.length===1)return enemies[0];
  if(r<0.9)return enemies[1]||enemies[0];
  return enemies[2]||enemies[0];
}
function findSpawnSpot(side){
  var prods=blds.filter(function(b){return b.side===side&&b.hp>0&&b.ready&&(b.type==='barracks'||b.type==='warfactory'||b.type==='lab');});
  var src=prods.length?prods[~~(Math.random()*prods.length)]:blds.find(function(b){return b.type==='hq'&&b.side===side&&b.hp>0;});
  if(!src)return{x:MW/2,y:MH/2};
  var baseAng=Math.atan2(MH/2-src.y,MW/2-src.x);
  var best=null,bestScore=-1;
  for(var rr=1;rr<=7;rr++){
    for(var a=0;a<12;a++){
      var ang=baseAng+a*PI/6;
      var px=src.x+Math.cos(ang)*rr*28,py=src.y+Math.sin(ang)*rr*28;
      if(!passable(px,py))continue;
      var crowded=0;
      for(var i=0;i<units.length;i++){
        if(units[i].hp>0&&Math.hypot(units[i].x-px,units[i].y-py)<50)crowded++;
      }
      for(var i=0;i<miners.length;i++){
        if(miners[i].hp>0&&Math.hypot(miners[i].x-px,miners[i].y-py)<40)crowded++;
      }
      var score=100-crowded*30-rr*2;
      if(score>bestScore){bestScore=score;best={x:px,y:py};}
      if(crowded===0&&rr<=3)return best;
    }
  }
  return best||{x:src.x+Math.cos(baseAng)*(src.sz*T/2+40),y:src.y+Math.sin(baseAng)*(src.sz*T/2+40)};
}
function captureHQ(hq,newSide){
  var oldSide=hq.side;
  var keepHQs=[];
  blds.forEach(function(b){if(b.type==='hq'&&b.side===oldSide&&b.hp>0&&b!==hq)keepHQs.push(b);});
  var lastHQ=keepHQs.length===0;
  if(lastHQ){

  }
  function nearCaptured(obj){
    var dCap=dist(obj,hq);

      if(dist(obj,keepHQs[i])<=dCap)return false;
    }

  }
  blds.forEach(function(b){
    if(b.side===oldSide&&b.hp>0&&b!==hq&&nearCaptured(b))b.side=newSide;
  });

  });

    if(m.side===oldSide&&m.hp>0&&nearCaptured(m))m.side=newSide;
  });

    if(u.side===newSide&&u.tgt===hq){u.tgt=null;u.tx=undefined;u.ty=undefined;u._path=null;}
  });
  units.forEach(function(u){
    if(u.tgt&&u.tgt.side!==undefined&&u.tgt.side===u.side){u.tgt=null;u.tx=undefined;u.ty=undefined;u._path=null;}
  });
  parts.push({x:hq.x,y:hq.y,vx:0,vy:0,life:60,col:SIDES[newSide].c,sz:20});
}
function dealDmg(target,dmg){
  target.hp-=dmg;
  if(target.hp<=0){
    target.hp=0;
    if(target.x!==undefined)parts.push({x:target.x,y:target.y,vx:0,vy:0,life:40,col:'#f80'});
    if(target.type==='hq'){
      var attacker=-1;
      for(var i=units.length-1;i>=0;i--){
        if(units[i].hp<=0)continue;
        if(Math.abs(units[i].x-target.x)<300&&Math.abs(units[i].y-target.y)<300&&units[i].side!==target.side){attacker=units[i].side;break;}
      }
      if(attacker>=0&&attacker!==target.side){
        captureHQ(target,attacker);
      }
    }
    sideGold[target.side]+=50;
    if(target.side===mySide)gold=sideGold[mySide];
    var killer=findKiller(target.side,target);
    if(killer&&killer.hp>0){
      killer.ex=(killer.ex||0)+50;
      killer.kills=(killer.kills||0)+1;
      if(killer.kills>=3)levelUpUnit(killer);
    }
  }
}

// 找到击杀者
function findKiller(deadSide,target){
  var best=null,bd=99999;
  for(var i=0;i<units.length;i++){
    var u=units[i];
    if(u.hp<=0||u.side===deadSide)continue;
    if(u.tgt===target)return u;
    var d=dist(u,target);
    if(d<bd&&d<u.rng+60){bd=d;best=u;}
  }
  return best;
}

// 单位升级
function levelUpUnit(u){
  u.lv=(u.lv||0)+1;
  u.ex=0;
  u.kills=0;
  u.atk=Math.floor(u.atk*1.15)+2;
  u.mhp=Math.floor(u.mhp*1.1);
  u.hp=u.mhp;
  u.rng+=5;
  parts.push({x:u.x,y:u.y,vx:0,vy:-1,life:40,col:'#ff0',sz:6});
}
function hasLab(side){return blds.some(function(b){return b.type==='lab'&&b.side===side&&b.hp>0;});}

function moveTowMiner(o,tx,ty,spd){
  var dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  if(d<3)return true;
  if(!passable(o.x,o.y)){
    var ang=Math.random()*PI*2;
    for(var a=0;a<8;a++){
      var ta=ang+a*PI/4,tx2=o.x+Math.cos(ta)*T*0.6,ty2=o.y+Math.sin(ta)*T*0.6;
      if(passable(tx2,ty2)){o.x=tx2;o.y=ty2;return false;}
    }
    return false;
  }
  if(!o._path||o._pi===undefined||Math.random()<0.03){
    var p=findPath(o.x,o.y,tx,ty);
    if(p&&p.length>0){o._path=p;o._pi=0;}
  }
  var step=null;
  if(o._path&&o._pi<o._path.length){
    var wp=o._path[o._pi];
    if(Math.hypot(wp.x-o.x,wp.y-o.y)<15)o._pi++;
    if(o._pi<o._path.length)step=o._path[o._pi];
  }
  var moved=false;
  if(step){
    var ndx=step.x-o.x,ndy=step.y-o.y,nd=Math.hypot(ndx,ndy);
    if(nd>2){
      var sp=spd*tSpd(o.x,o.y),nx=o.x+ndx/nd*sp,ny=o.y+ndy/nd*sp;
      if(passable(nx,o.y)&&passable(o.x,ny)){o.x=nx;o.y=ny;moved=true;}
      else if(passable(nx,o.y)){o.x=nx;moved=true;}
      else if(passable(o.x,ny)){o.y=ny;moved=true;}
    }
  }else{
    var sp2=spd*tSpd(o.x,o.y),nx2=o.x+dx/d*sp2,ny2=o.y+dy/d*sp2;
    if(passable(nx2,ny2)){o.x=nx2;o.y=ny2;moved=true;}
    else if(passable(nx2,o.y)){o.x=nx2;moved=true;}
    else if(passable(o.x,ny2)){o.y=ny2;moved=true;}
  }
  if(!moved){
    var sp3=spd*tSpd(o.x,o.y);
    var ang2=Math.atan2(dy,dx);
    for(var a2=-2;a2<=2;a2++){
      var ta2=ang2+a2*0.4,nx3=o.x+Math.cos(ta2)*sp3,ny3=o.y+Math.sin(ta2)*sp3;
      if(passable(nx3,ny3)){o.x=nx3;o.y=ny3;moved=true;break;}
    }
  }
  return false;
}
function updateMiners(){
  miners.forEach(function(m){
    if(m.hp<=0)return;
    if(!m.home||m.home.hp<=0){
      var refs=blds.filter(function(b){return b.type==='refinery'&&b.side===m.side&&b.hp>0;});
      m.home=refs.length>0?refs[0]:null;
    }
    if(!m.home)return;
    // stuck detection
    if(m._lastX!==undefined&&Math.abs(m.x-m._lastX)<0.5&&Math.abs(m.y-m._lastY)<0.5){
      m._stuckCount=(m._stuckCount||0)+1;
      if(m._stuckCount>60){
        // teleport slightly to escape
        var ang=Math.random()*PI*2;m.x+=Math.cos(ang)*30;m.y+=Math.sin(ang)*30;
        m._stuckCount=0;m._path=null;
      }
    }else{m._stuckCount=0;}
    m._lastX=m.x;m._lastY=m.y;
    if(m.st==='idle'){
      if(m.carry>0){
        if(dist(m,m.home)<60){
          sideGold[m.side]+=m.carry;
          if(m.side===mySide)gold=sideGold[mySide];
          m.carry=0;
        }else{moveTowMiner(m,m.home.x,m.home.y,m.spd);}
      }else{
        var best=null,bd=99999;
        for(var i=0;i<ores.length;i++){
          if(ores[i].a<=0)continue;
          var d=Math.hypot(m.x-ores[i].x,m.y-ores[i].y);
          if(d<bd){bd=d;best=ores[i];}
        }
        if(best){
          if(bd<30){var take=Math.min(80,best.a);m.carry+=take;best.a-=take;if(m.carry>0)m.st='return';}
          else{moveTowMiner(m,best.x,best.y,m.spd);}
        }else{
          if(Math.random()<0.05){var ang=Math.random()*PI*2;m._tx=m.home.x+Math.cos(ang)*200;m._ty=m.home.y+Math.sin(ang)*200;}
          if(m._tx!==undefined)moveTowMiner(m,m._tx,m._ty,m.spd*0.5);
        }
      }
    }else if(m.st==='return'){
      if(m.carry<=0){m.st='idle';return;}
      if(dist(m,m.home)<60){sideGold[m.side]+=m.carry;if(m.side===mySide)gold=sideGold[mySide];m.carry=0;m.st='idle';}
      else{moveTowMiner(m,m.home.x,m.home.y,m.spd);}
    }
  });
}

function updateUnits(){
  units.forEach(function(u){
    if(u.hp<=0)return;
    u.cooldown=u.cooldown?u.cooldown-1:0;

    // ===== 玩家移动命令：优先执行，仅对射程内敌人开火，不追击 =====
    if(isHumanSide(u.side)&&u.ord==='m'){
      if(u.tx===undefined){u.ord=null;}
      else{
        var fireT=null,fd=u.rng;
        for(var i=0;i<units.length;i++){
          var e=units[i];
          if(e.side===u.side||e.hp<=0)continue;
          var dd=dist(u,e);
          if(dd<fd){fd=dd;fireT=e;}
        }
        if(fireT&&u.cooldown<=0){
          bullets.push({x:u.x,y:u.y,tx:fireT.x,ty:fireT.y,spd:5,dmg:u.atk,side:u.side,life:60});
          u.cooldown=u.rt;
        }
        if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;u.ord=null;u._path=null;}
        return;
      }
    }

    // ===== 玩家攻击命令：只打指定目标 =====
    if(isHumanSide(u.side)&&u.ord==='a'){
      var at=u.tgt;
      if(!at||at.hp<=0||(at.side!==undefined&&at.side===u.side)){
        u.ord=null;u.tgt=null;
      }else{
        var ad=dist(u,at);
        if(ad<=u.rng){
          u.tx=undefined;u.ty=undefined;u._path=null;
          if(u.cooldown<=0){
            bullets.push({x:u.x,y:u.y,tx:at.x,ty:at.y,spd:5,dmg:u.atk,side:u.side,life:60});
            u.cooldown=u.rt;
          }
        }else{moveTow(u,at.x,at.y,u.spd);}
        return;
      }
    }

    // ===== 工程师：有玩家指令听指令，否则自动维修 =====
    if(u.type==='engineer'){
      if(isHumanSide(u.side)&&u.tx!==undefined){
        if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;u._path=null;}
        return;
      }
      var repairTarget=null,repairBest=1e9;
      for(var i=0;i<blds.length;i++){
        var b=blds[i];
        if(b.side!==u.side||b.hp<=0||b.hp>=b.mhp-1||b.type==='wall')continue;
        var d2=dist(u,b);
        if(d2<repairBest){repairBest=d2;repairTarget=b;}
      }
      if(repairTarget){
        var reach=repairTarget.sz*T/2+36;
        if(repairBest<=reach){
          repairTarget.hp=Math.min(repairTarget.mhp,repairTarget.hp+8);
          u.cooldown=15;
          if(gt%8===0)parts.push({x:repairTarget.x,y:repairTarget.y-reach*0.4,vx:(Math.random()-0.5)*2,vy:-1,life:20,col:'#0f0',sz:3});
        }else{
          var angR=Math.atan2(u.y-repairTarget.y,u.x-repairTarget.x);
          var ax=repairTarget.x+Math.cos(angR)*reach;
          var ay=repairTarget.y+Math.sin(angR)*reach;
          if(!passable(ax,ay)){ax=repairTarget.x;ay=repairTarget.y;}
          moveTow(u,ax,ay,u.spd);
        }
        return;
      }
      if(u.hp<u.mhp&&gt%30===0)u.hp=Math.min(u.mhp,u.hp+2);
      if(isHumanSide(u.side)&&u.tx!==undefined){if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;}}
      return;
    }

    // HQ defense: prioritize enemies near own HQ
    if(!isHumanSide(u.side)){
      var myHQ=blds.find(function(b){return b.type==='hq'&&b.side===u.side&&b.hp>0;});
      if(myHQ&&dist(u,myHQ)<400){
        var threat=units.find(function(e){return e.side!==u.side&&e.hp>0&&dist(e,myHQ)<350;});
        if(threat){
          u.tgt=threat;
          var d=dist(u,threat);
          if(d<=u.rng){
            u.tx=undefined;u.ty=undefined;u._path=null;
            if(u.cooldown<=0){bullets.push({x:u.x,y:u.y,tx:threat.x,ty:threat.y,spd:5,dmg:u.atk,side:u.side,life:60});u.cooldown=u.rt;}
          }else{moveTow(u,threat.x,threat.y,u.spd);}
          return;
        }
      }
    }
    var tgt=u.tgt;
    if(!tgt||tgt.hp<=0||dist(u,tgt)>u.rng*2||(u.wSide!==undefined&&tgt.side!==u.wSide&&tgt.side!==undefined)){
      var scanRng=u.tx!==undefined?(u.wSide!==undefined?u.rng*2:u.rng):u.rng*2.5;
      u.tgt=findTgt(u,scanRng);tgt=u.tgt;
    }
    if(tgt&&tgt.hp>0){
      var d=dist(u,tgt);
      if(d<=u.rng){
        u.tx=undefined;u.ty=undefined;u._path=null;
        if(u.cooldown<=0){bullets.push({x:u.x,y:u.y,tx:tgt.x,ty:tgt.y,spd:5,dmg:u.atk,side:u.side,life:60});u.cooldown=u.rt;}
      }else if(d<=u.rng*4||(u.wSide!==undefined&&tgt.side===u.wSide)){moveTow(u,tgt.x,tgt.y,u.spd);}
      else if(u.tx!==undefined){if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;}}
    }else if(u.tx!==undefined){if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;if(u.wSide!==undefined)u.wSide=undefined;}}
  });
}

function updateBullets(){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    var dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);
    if(d<8){
      var targets=units.concat(miners).concat(blds);
      for(var j=0;j<targets.length;j++){
        var t=targets[j];
        if(t.side===b.side||t.hp<=0)continue;
        if(Math.abs(t.x-b.tx)<20&&Math.abs(t.y-b.ty)<20){dealDmg(t,b.dmg);break;}
      }
      parts.push({x:b.x,y:b.y,vx:0,vy:0,life:15,col:SIDES[b.side]?SIDES[b.side].c:'#888'});
      bullets.splice(i,1);continue;
    }
    b.x+=dx/d*b.spd;b.y+=dy/d*b.spd;b.life--;
    if(b.life<=0)bullets.splice(i,1);
  }
}
function updateParticles(){
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life--;p.x+=p.vx;p.y+=p.vy;if(p.life<=0)parts.splice(i,1);}
}

function updateTurrets(){
  blds.forEach(function(b){
    if(b.hp<=0||b.atk<=0)return;
    b._cd=(b._cd||0)-1;
    if(b._cd>0)return;
    var rng=b.type==='missile'?250:160;
    var maxTargets=b.type==='missile'?3:2;
    var targets=[];
    var scan=blds.filter(function(e){return e.side!==b.side&&e.hp>0;})
      .concat(units.filter(function(e){return e.side!==b.side&&e.hp>0;}))
      .concat(miners.filter(function(e){return e.side!==b.side&&e.hp>0;}));
    for(var i=0;i<scan.length&&targets.length<maxTargets;i++){
      var d=dist(b,scan[i]);
      if(d<rng)targets.push(scan[i]);
    }
    targets.forEach(function(t){
      bullets.push({x:b.x,y:b.y-10,tx:t.x,ty:t.y,spd:5,dmg:b.atk,side:b.side,life:50});
    });
    if(targets.length>0)b._cd=b.type==='missile'?60:30;
  });
}

function pushUnits(){
  var all=units.concat(miners);
  for(var i=0;i<all.length;i++){for(var j=i+1;j<all.length;j++){
    var a=all[i],b=all[j];
    if(a.hp<=0||b.hp<=0)continue;
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<14&&d>0.1){
      var p=(14-d)*0.4;
      var nax=a.x-dx/d*p,nay=a.y-dy/d*p,nbx=b.x+dx/d*p,nby=b.y+dy/d*p;
      if(passable(nax,nay))a.x=nax,a.y=nay;
      if(passable(nbx,nby))b.x=nbx,b.y=nby;
    }
  }}
  for(var i=0;i<all.length;i++){
    var u=all[i];
    if(u.hp<=0)continue;
    if(!passable(u.x,u.y)){
      var ang=Math.random()*PI*2;
      for(var a=0;a<8;a++){
        var ta=ang+a*PI/4,tx=u.x+Math.cos(ta)*T*0.8,ty=u.y+Math.sin(ta)*T*0.8;
        if(passable(tx,ty)){u.x=tx;u.y=ty;u._path=null;u._stuckN=0;break;}
      }
    }
  }
}

function runAI(side){
  var ai=ais[side];if(!ai)return;
  ai.timer--;ai.bt--;ai.ut--;
  var myGold=sideGold[side];
  var myHQ=blds.find(function(b){return b.type==='hq'&&b.side===side&&b.hp>0;});
  var hx=myHQ?myHQ.x:MW/2,hy=myHQ?myHQ.y:MH/2;
  var strat=ai.strategy||'infantry';

  // ===== BUILD =====
  if(ai.bt<=0){
    ai.bt=strat==='turtle'?250:350;
    var hasB={};var bCount={};
    blds.forEach(function(b){if(b.side===side){hasB[b.type]=1;bCount[b.type]=(bCount[b.type]||0)+1;}});
    var order;
    if(strat==='turtle'){
      order=['power','refinery','refinery','barracks','turret','missile','turret','missile','lab','turret','missile','warfactory','refinery','turret','missile'];
    }else if(strat==='armor'){
      order=['power','refinery','refinery','barracks','warfactory','lab','warfactory','turret','missile','refinery','warfactory'];
    }else{
      order=['power','refinery','refinery','barracks','barracks','warfactory','lab','turret','barracks','refinery','missile'];
    }
    var built=0;
    for(var loop=0;loop<3;loop++){
      for(var i=0;i<order.length;i++){
        var id=order[i];
        var maxCount;
        if(strat==='turtle'){maxCount=id==='turret'?8:id==='missile'?6:id==='refinery'?4:id==='lab'?1:1;}
        else if(strat==='armor'){maxCount=id==='warfactory'?3:id==='turret'?3:id==='missile'?2:id==='refinery'?3:id==='lab'?1:1;}
        else{maxCount=id==='barracks'?3:id==='turret'?2:id==='missile'?2:id==='refinery'?3:id==='lab'?1:1;}
        if((bCount[id]||0)<maxCount&&sideGold[side]>=BD[id].g){
          var bx,by;
          if(id==='turret'||id==='missile'){
            if(strat==='turtle'){
              var ang=Math.random()*PI*2;var r=120+Math.random()*200;
              bx=hx+Math.cos(ang)*r;by=hy+Math.sin(ang)*r;
            }else{
              var ang=Math.random()*PI*2;var r=180+Math.random()*120;
              bx=hx+Math.cos(ang)*r;by=hy+Math.sin(ang)*r;
            }
          }else{
            var spread=150+i*60;
            bx=hx+(Math.random()-0.5)*spread*2;by=hy+(Math.random()-0.5)*spread*2;
          }
          bx=Math.max(120,Math.min(MW-120,bx));by=Math.max(120,Math.min(MH-120,by));
          var ok=true;var sz=BD[id].sz*T/2;
          for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++){
            var tx=~~(bx/T)+dx,ty=~~(by/T)+dy;
            if(ty<0||ty>=mData.length||tx<0||tx>=mData[0].length||mData[ty][tx]===3||mData[ty][tx]===4)ok=false;
          }
          if(ok){for(var j=0;j<blds.length;j++){var ob=blds[j];if(ob.hp<=0)continue;if(Math.abs(ob.x-bx)<(ob.sz*T/2+sz)&&Math.abs(ob.y-by)<(ob.sz*T/2+sz))ok=false;}}
          if(ok){sideGold[side]-=BD[id].g;addB(id,bx,by,side);bCount[id]=(bCount[id]||0)+1;built++;}
          if(built>=2)break;
        }
      }
      if(built>=2)break;
    }
  }

  // ===== TRAIN UNITS =====
  if(ai.ut<=0){
    ai.ut=strat==='turtle'?80:strat==='armor'?60:40;
    var hasBarr=blds.some(function(b){return b.type==='barracks'&&b.side===side&&b.hp>0&&b.ready;});
    var hasFac=blds.some(function(b){return b.type==='warfactory'&&b.side===side&&b.hp>0&&b.ready;});
    var labOk=hasLab(side);
    var armyCount=units.filter(function(u){return u.side===side&&u.hp>0;}).length;
    var maxUnits=strat==='turtle'?20:strat==='armor'?30:40;
    if(armyCount<maxUnits){
      if(strat==='armor'){
        if(labOk&&hasFac&&sideGold[side]>=2500){sideGold[side]-=2500;spawnUnit('hero',0,0,side);}
        else if(labOk&&hasFac&&sideGold[side]>=900){sideGold[side]-=900;spawnUnit('heavy',0,0,side);}
        else if(labOk&&hasFac&&sideGold[side]>=700){sideGold[side]-=700;spawnUnit('artillery',0,0,side);}
        else if(hasFac&&sideGold[side]>=500){sideGold[side]-=500;spawnUnit('light',0,0,side);}
        else if(hasBarr&&sideGold[side]>=200){sideGold[side]-=200;spawnUnit('rocket',0,0,side);}
        else if(hasBarr&&sideGold[side]>=100){sideGold[side]-=100;spawnUnit('rifle',0,0,side);}
      }else if(strat==='turtle'){
        if(labOk&&hasFac&&sideGold[side]>=2500){sideGold[side]-=2500;spawnUnit('hero',0,0,side);}
        else if(hasFac&&sideGold[side]>=500){sideGold[side]-=500;spawnUnit('light',0,0,side);}
        else if(hasBarr&&sideGold[side]>=200){sideGold[side]-=200;spawnUnit('rocket',0,0,side);}
        else if(hasBarr&&sideGold[side]>=100){sideGold[side]-=100;spawnUnit('rifle',0,0,side);}
      }else{
        if(hasBarr&&sideGold[side]>=100){sideGold[side]-=100;spawnUnit('rifle',0,0,side);}
        else if(hasBarr&&sideGold[side]>=200){sideGold[side]-=200;spawnUnit('rocket',0,0,side);}
        else if(hasFac&&sideGold[side]>=500){sideGold[side]-=500;spawnUnit('light',0,0,side);}
      }
    }
  }

  // ===== ATTACK: pick weakest enemy, keep pushing =====
  ai.timer--;
  var myArmy=units.filter(function(u){return u.side===side&&u.hp>0;});
  if(ai.atkOn){
    var eHQ=blds.find(function(b){return b.type==='hq'&&b.side===ai.atkSide&&b.hp>0;});
    if(!eHQ){ai.atkOn=false;ai.atkSide=null;ai.timer=400;}
    else{
      for(var ui=0;ui<myArmy.length;ui++){
        var au=myArmy[ui];
        if(au.type==='engineer')continue;
        var engaged=au.tgt&&au.tgt.hp>0&&dist(au,au.tgt)<au.rng*2.5;
        if(!engaged&&au.tx===undefined){
          var wa=ui*2.4;
          au.tx=eHQ.x+Math.cos(wa)*280;
          au.ty=eHQ.y+Math.sin(wa)*280;
          au.wSide=ai.atkSide;
          au.tgt=null;au._path=null;au._stuckN=0;
        }else if(au.tx!==undefined){au.wSide=ai.atkSide;}
      }
      var defendersNear=0;
      for(var di=0;di<myArmy.length;di++){
        if(myHQ&&dist(myArmy[di],myHQ)<350)defendersNear++;
      }
      if(myArmy.length<=1&&defendersNear===0){ai.atkOn=false;ai.atkSide=null;ai.timer=600;}
    }
  }else if(ai.timer<=0){
    var minArmy=strat==='turtle'?6:strat==='armor'?4:3;
    if(myArmy.length>=minArmy){
      var tSide=pickWeakTarget(side);
      if(tSide!==null&&tSide!==undefined){
        ai.atkSide=tSide;ai.atkOn=true;
        var eHQ2=blds.find(function(b){return b.type==='hq'&&b.side===tSide&&b.hp>0;});
        if(eHQ2){
          for(var ui2=0;ui2<myArmy.length;ui2++){
            var au2=myArmy[ui2];
            if(au2.type==='engineer')continue;
            au2.tx=eHQ2.x+Math.cos(ui2*2.4)*300;
            au2.ty=eHQ2.y+Math.sin(ui2*2.4)*300;
            au2.tgt=null;au2._path=null;au2._stuckN=0;au2.wSide=tSide;
          }
        }
        ai.timer=1800+~~(Math.random()*600);ai.wave++;
      }else{ai.timer=600;}
    }else{ai.timer=300;}
  }

  // ===== RAID: small harassment when not full attacking =====
  if(!ai.atkOn){
    ai.raidCd=(ai.raidCd===undefined?600:ai.raidCd)-1;
    if(ai.raidCd<=0){
      ai.raidCd=900+~~(Math.random()*600);
      var raiders=myArmy.filter(function(u){return u.type!=='engineer'&&u.tx===undefined&&!u.tgt;}).slice(0,4);
      if(raiders.length>=3){
        var rSide=pickWeakTarget(side);
        if(rSide!==null){
          var rTgt=blds.find(function(b){return b.side===rSide&&b.hp>0&&(b.type==='refinery'||b.type==='power');})
            ||blds.find(function(b){return b.side===rSide&&b.type==='hq'&&b.hp>0;});
          if(rTgt){
            raiders.forEach(function(u){u.tx=rTgt.x+(Math.random()-.5)*80;u.ty=rTgt.y+(Math.random()-.5)*80;u.wSide=rSide;u.tgt=null;u._path=null;});
          }
        }
      }
    }
  }
}

function spawnUnit(type,x,y,side){
  var d=UD[type];
  if(x===0&&y===0){var sp=findSpawnSpot(side);x=sp.x;y=sp.y;}
  for(var attempt=0;attempt<16;attempt++){
    var blocked=false;
    for(var i=0;i<blds.length;i++){var b=blds[i],bs=b.sz*T/2+8;if(Math.abs(b.x-x)<bs&&Math.abs(b.y-y)<bs){blocked=true;break;}}
    if(!blocked&&passable(x,y))break;
    var ang=Math.random()*PI*2;var step=28+attempt*6;
    x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;
    x=Math.max(50,Math.min(MW-50,x));y=Math.max(50,Math.min(MH-50,y));
  }
  var u={id:_eid++,type:type,x:x,y:y,side:side,hp:d.hp,mhp:d.hp,atk:d.atk,spd:d.spd,rng:d.rng,rt:d.rt,ar:d.ar,
    cooldown:0,tx:undefined,ty:undefined,tgt:null,_path:null,_pi:0,ex:0,lv:0,kills:0,skillCd:600,wSide:undefined,_stuckN:0,_wfSide:Math.random()<0.5?1:-1,ord:null};
  if(type==='hero'){u.hp=2500;u.mhp=2500;u.atk=80;u.spd=1.5;u.rng=160;u.rt=35;u.ar='hv';}
  units.push(u);
  return u;
}

function drawMinimap(){

    mx2.fillRect(x*T*sx,y*T*sy,Math.ceil(T*sx)+1,Math.ceil(T*sy)+1);
  }}
  units.forEach(function(u){if(u.hp<=0)return;mx2.fillStyle=sideColor(u.side);mx2.fillRect(u.x*sx-1,u.y*sy-1,2,2);});
  miners.forEach(function(m){if(m.hp<=0)return;mx2.fillStyle=sideColor(m.side);mx2.fillRect(m.x*sx-1,m.y*sy-1,2,2);});
  blds.forEach(function(b){
    if(b.hp<=0)return;
    mx2.fillStyle=sideColor(b.side);
    if(b.type==='hq'){mx2.fillRect(b.x*sx-3,b.y*sy-3,6,6);mx2.fillStyle='#fff';mx2.font='6px sans-serif';mx2.textAlign='left';mx2.fillText(SIDES[b.side]&&SIDES[b.side].fl||'',b.x*sx+3,b.y*sy-2);}
    else mx2.fillRect(b.x*sx-2,b.y*sy-2,4,4);
  });
  mx2.strokeStyle='#fff';mx2.lineWidth=1;mx2.strokeRect(camX*sx,camY*sy,(W/camZ)*sx,(H/camZ)*sy);

var mcp=document.getElementById('minimap');
function getPos(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}

function onDown(e){
  if(gOver){genMap();return;}
  var p=getPos(e);
  if(e.target===mcp){var r=mm.getBoundingClientRect();camX=((p.x-r.left)/r.width)*MW-W/2/camZ;camY=((p.y-r.top)/r.height)*MH-H/2/camZ;return;}
  if(p.y<36)return;
  if(e.button===2){
    var wp=scrToWorld(p.x,p.y);
    if(selU.length>0){
      var clickedEnemy=false;
      units.forEach(function(u){if(u.side!==mySide&&Math.hypot(u.x-wp.x,u.y-wp.y)<20){orderAttack(selU,u,'unit');clickedEnemy=true;}});
      blds.forEach(function(b){if(b.side!==mySide&&b.hp>0&&Math.hypot(b.x-wp.x,b.y-wp.y)<b.sz*T/2+10){orderAttack(selU,b,'bld');clickedEnemy=true;}});
      miners.forEach(function(m){if(m.side!==mySide&&m.hp>0&&Math.hypot(m.x-wp.x,m.y-wp.y)<15){orderAttack(selU,m,'miner');clickedEnemy=true;}});
      if(!clickedEnemy){
        orderMove(selU,wp.x,wp.y);
        parts.push({x:wp.x,y:wp.y,vx:0,vy:0,life:40,col:'#0f0',sz:8});
      }
    }else{
      if(NET.mode==='guest'){netCmd({k:'miner',x:wp.x,y:wp.y});}
      else{miners.forEach(function(m){
        if(m.side!==mySide||m.hp<=0)return;
        if(dist(m,wp)<400){
          m.st='idle';m.carry=0;m._path=null;
          m._tx=wp.x+(Math.random()-0.5)*100;
          m._ty=wp.y+(Math.random()-0.5)*100;
        }
      });}
      parts.push({x:wp.x,y:wp.y,vx:0,vy:0,life:30,col:'#fc0',sz:6});
    }
    return;
  }
  if(p.y>H-170)return;
  if(bldMode){
    if(canBuild(bldMode,bldX,bldY)){
      if(NET.mode==='guest'){
        netCmd({k:'build',type:bldMode,x:bldX,y:bldY});
        var _gd=BD[bldMode];
        sideGold[mySide]=Math.max(0,sideGold[mySide]-_gd.g);gold=sideGold[mySide];
        var _gh={id:-1,type:bldMode,side:mySide,x:bldX,y:bldY,hp:_gd.hp,mhp:_gd.hp,ready:0,bt:120,sz:_gd.sz,atk:0,art:0,_ghost:1,t:Date.now()};
        NET.ghosts.push(_gh);blds.push(_gh);

      }
      bldMode=null;buildPanels();

    return;
  }

}
function onMove(e){
  if(e)e.preventDefault();

  if(bldMode){var wp=scrToWorld(p.x,p.y);bldX=wp.x;bldY=wp.y;}
  if(mdn){var dx=p.x-dsx,dy=p.y-dsy;if(Math.abs(dx)+Math.abs(dy)>5)isDrag=true;if(isDrag)sBox={x1:dsx,y1:dsy,x2:p.x,y2:p.y};}
}
function onUp(e){
  if(isDrag&&sBox){
    var x1=Math.min(sBox.x1,sBox.x2),y1=Math.min(sBox.y1,sBox.y2);
    var x2=Math.max(sBox.x1,sBox.x2),y2=Math.max(sBox.y1,sBox.y2);
    selU=[];selB=null;
    units.forEach(function(u){if(u.side!==mySide||u.hp<=0)return;var sp=worldToScr(u.x,u.y);if(sp.x>=x1&&sp.x<=x2&&sp.y>=y1&&sp.y<=y2)selU.push(u);});
    if(selU.length===0){
      var wp=scrToWorld((x1+x2)/2,(y1+y2)/2);
      blds.forEach(function(b){if(b.side!==mySide||b.hp<=0)return;if(Math.abs(b.x-wp.x)<b.sz*T/2&&Math.abs(b.y-wp.y)<b.sz*T/2)selB=b;});
    }
  }else if(!isDrag&&e&&e.button===0){
    var p=getPos(e);var wp=scrToWorld(p.x,p.y);
    if(selU.length>0){
      var clickedEnemy=false;
      units.forEach(function(u){if(u.side!==mySide&&Math.hypot(u.x-wp.x,u.y-wp.y)<20){orderAttack(selU,u,'unit');clickedEnemy=true;}});
      blds.forEach(function(b){if(b.side!==mySide&&b.hp>0&&Math.hypot(b.x-wp.x,b.y-wp.y)<b.sz*T/2+10){orderAttack(selU,b,'bld');clickedEnemy=true;}});
      miners.forEach(function(m){if(m.side!==mySide&&m.hp>0&&Math.hypot(m.x-wp.x,m.y-wp.y)<15){orderAttack(selU,m,'miner');clickedEnemy=true;}});
      if(!clickedEnemy){
        var clickedOwn=false;
        units.forEach(function(u){if(u.side===mySide&&u.hp>0&&Math.hypot(u.x-wp.x,u.y-wp.y)<15){selU=[u];clickedOwn=true;}});
        if(!clickedOwn){
          orderMove(selU,wp.x,wp.y);
          parts.push({x:wp.x,y:wp.y,vx:0,vy:0,life:40,col:'#0f0',sz:8});
        }
      }
    }else{
      selU=[];selB=null;
      units.forEach(function(u){if(u.side!==mySide||u.hp<=0)return;if(Math.hypot(u.x-wp.x,u.y-wp.y)<15)selU.push(u);});
      if(selU.length===0){blds.forEach(function(b){if(b.side!==mySide||b.hp<=0)return;if(Math.abs(b.x-wp.x)<b.sz*T/2&&Math.abs(b.y-wp.y)<b.sz*T/2)selB=b;});}
      if(selU.length===0&&!selB)bldMode=null;
    }
  }
  mdn=false;sBox=null;isDrag=false;updateSelInfo();
}

function buildPanels(){
  var pb=document.getElementById('pb');pb.innerHTML='';
  Object.keys(BD).forEach(function(id){
    if(id==='hq')return;
    var d=BD[id];
    var hasReq=(!d.rq||blds.some(function(b){return b.type===d.rq&&b.side===mySide&&b.hp>0;}))&&techUnlocked(id,mySide);
    var canAfford=gold>=d.g;
    var lk=!hasReq||!canAfford;
    var card=document.createElement('div');card.className='ic'+(lk?' lk':'');
    card.innerHTML='<div class="e">'+d.ic+'</div><div class="n">'+d.n+'</div><div class="p">'+d.g+'</div>';
    card.setAttribute('data-id',id);
    card.onclick=function(e){e.stopPropagation();if(this.classList.contains('lk'))return;var bid=this.getAttribute('data-id');bldMode=bldMode===bid?null:bid;};
    pb.appendChild(card);
  });
  var pu=document.getElementById('pu');pu.innerHTML='';
  Object.keys(UD).forEach(function(id){
    var d=UD[id];var cost=unitCost(d);
    var hasBld=blds.some(function(b){return b.type===d.rq&&b.side===mySide&&b.hp>0;});
    var techOk=techUnlocked(id,mySide);
    var canAfford=gold>=cost;
    var lk=!hasBld||!canAfford||!techOk;
    var card=document.createElement('div');card.className='ic'+(lk?' lk':'');
    card.innerHTML='<div class="e">'+(id==='engineer'?'🔧':id==='hero'?'⭐':d.ar==='air'?'🚁':d.ar==='hv'?'🔷':'👤')+'</div><div class="n">'+d.n+(techOk?'':' 🔒')+'</div><div class="p">'+cost+'</div>';
    card.setAttribute('data-id',id);
    card.onclick=function(e){
      e.stopPropagation();if(this.classList.contains('lk'))return;
      var uid=this.getAttribute('data-id');
      if(NET.mode==='guest'){netCmd({k:'train',type:uid});return;}

function canBuild(type,x,y,side){
  side=(side===undefined)?mySide:side;
  var d=BD[type],sz=d.sz*T/2;
  if(sideGold[side]<d.g)return false;
  if(!techUnlocked(type,side))return false;
  for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
    var tx=~~(x/T)+dx,ty=~~(y/T)+dy;
    if(ty<0||ty>=mData.length||tx<0||tx>=mData[0].length)return false;
    var t=mData[ty][tx];
    if(type==='bridge'){
      if(t!==3)return false;
    }else{
      if(t===3||t===4)return false;
    }
  }
  if(type==='tunnel'&&mData[~~(y/T)][~~(x/T)]!==4)return false;
  for(var i=0;i<blds.length;i++){var b=blds[i];if(b.hp<=0)continue;if(Math.abs(b.x-x)<(b.sz*T/2+sz)&&Math.abs(b.y-y)<(b.sz*T/2+sz))return false;}
  return true;
}

function nukeExplode(nx,ny,side,radius){
  screenFlash=1;
  nukeFx.push({x:nx,y:ny,t:0,dur:100,radius:radius});
  for(var a=0;a<80;a++){
    var ang=Math.random()*PI*2,r=Math.sqrt(Math.random())*radius*0.4;
    parts.push({x:nx+Math.cos(ang)*r,y:ny+Math.sin(ang)*r,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-3,life:50,col:Math.random()<0.5?'#fff':'#ff0',sz:8+Math.random()*12});
  }
  for(var a=0;a<100;a++){
    var ang=Math.random()*PI*2,r=Math.sqrt(Math.random())*radius;
    parts.push({x:nx+Math.cos(ang)*r,y:ny+Math.sin(ang)*r,vx:(Math.random()-.5)*3,vy:-1-Math.random()*3,life:70+~~(Math.random()*40),col:Math.random()<0.4?'#f80':Math.random()<0.5?'#ff0':'#833',sz:5+Math.random()*10});
  }
  for(var a=0;a<40;a++){
    var ang=-PI/2+(Math.random()-.5)*0.8,r=Math.random()*40;
    parts.push({x:nx+Math.cos(ang)*r,y:ny-r*1.5,vx:(Math.random()-.5)*2,vy:-3-Math.random()*4,life:90,col:Math.random()<0.5?'#666':'#999',sz:12+Math.random()*18});
  }
  units.forEach(function(u){
    if(u.side===side||u.hp<=0)return;
    var d=Math.hypot(u.x-nx,u.y-ny);
    if(d<radius)dealDmg(u,400+900*(1-d/radius));
  });
  miners.forEach(function(m){
    if(m.side===side||m.hp<=0)return;
    var d=Math.hypot(m.x-nx,m.y-ny);
    if(d<radius)dealDmg(m,500+800*(1-d/radius));
  });
  blds.forEach(function(t){
    if(t===null||t.side===side||t.hp<=0)return;
    var d=Math.hypot(t.x-nx,t.y-ny);
    if(d>=radius)return;
    var fall=1-d/radius;
    if(t.type==='hq'){
      var dmg=Math.min(t.hp-1,1100+400*fall);
      if(dmg>0)dealDmg(t,dmg);
    }else if(t.type==='nukesilo'){
      dealDmg(t,600+700*fall);
    }else{
      dealDmg(t,250+700*fall);
    }
  });
}
function updateNukes(){
  if(screenFlash>0)screenFlash=Math.max(0,screenFlash-0.03);
  for(var i=nukeFx.length-1;i>=0;i--){
    nukeFx[i].t++;
    if(nukeFx[i].t>=nukeFx[i].dur)nukeFx.splice(i,1);
  }
  for(var i=nukes.length-1;i>=0;i--){
    var nk=nukes[i];
    nk.t++;
    if(nk.t>=nk.dur){
      nukeExplode(nk.tx,nk.ty,nk.side,nk.radius);
      nukes.splice(i,1);
      continue;
    }
    var pr=nk.t/nk.dur;
    nk.x=nk.sx+(nk.tx-nk.sx)*pr;
    nk.y=nk.sy+(nk.ty-nk.sy)*pr-Math.sin(pr*PI)*120;
    if(nk.t%3===0)parts.push({x:nk.x,y:nk.y,vx:(Math.random()-.5),vy:0.5,life:20,col:'#ccc',sz:3+Math.random()*3});
  }
  blds.forEach(function(b){
    if(b.type!=='nukesilo'||b.hp<=0||!b.ready)return;
    if(!b.nukeCd)b.nukeCd=1800;
    b.nukeCd--;
    if(b.nukeCd<=0){
      b.nukeCd=1800;
      var best=null,bd=99999;
      blds.forEach(function(h){
        if(h.type==='hq'&&h.side!==b.side&&h.hp>0){
          var d=dist(b,h);
          if(d<bd){bd=d;best=h;}
        }
      });
      if(!best){
        var es=units.filter(function(u){return u.side!==b.side&&u.hp>0;});
        if(es.length)best=es[~~(Math.random()*es.length)];
      }
      if(best){
        nukes.push({sx:b.x,sy:b.y,tx:best.x,ty:best.y,side:b.side,t:0,dur:110,radius:340,x:b.x,y:b.y});
        parts.push({x:b.x,y:b.y-30,vx:0,vy:-2,life:40,col:'#f80',sz:10});
      }
    }
  });
}

var RA_VER='RA1';
var NET={mode:'off',ws:null,server:'',room:'',cid:'',name:'',isHost:false,connected:false,
  players:{},desireSide:0,pw:null,pu:null,winSide:-1,alive:[1,1,1,1],ghosts:[],
  snapAcc:0,snapEvery:4,uStore:{},bStore:{},mStore:{},started:false};

function lbMsg(s){var e=document.getElementById('lb-msg');if(e)e.textContent=s||'';}
function defaultServer(){
  if(location.protocol==='http:'||location.protocol==='https:')
    return (location.protocol==='https:'?'wss://':'ws://')+location.host;
  return localStorage.getItem('ra_server')||'';
}

function getLbServer(){var s=document.getElementById('lb-server').value.trim();if(s)localStorage.setItem('ra_server',s);return s||defaultServer();}

function netSend(o){if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify(o));}catch(e){}}}
function netConnect(server,onopen,onfail){
  try{if(NET.ws){NET.ws.onclose=null;NET.ws.close();}}catch(e){}
  var ws; try{ws=new WebSocket(server);}catch(e){onfail&&onfail('地址无效: '+server);return;}
  NET.ws=ws; var done=false;
  var to=setTimeout(function(){if(!done){done=true;try{ws.close();}catch(e){}onfail&&onfail('连接超时：服务器可能正在唤醒，请等1分钟再试');}},12000);
  ws.onopen=function(){done=true;clearTimeout(to);NET.connected=true;try{if(NET.hb)clearInterval(NET.hb);}catch(e){}NET.hb=setInterval(function(){netSend({t:'ping'});},8000);onopen&&onopen();};
  ws.onmessage=function(ev){try{onNetMsg(JSON.parse(ev.data));}catch(e){}};
  ws.onerror=function(){if(!done){done=true;clearTimeout(to);onfail&&onfail('连接失败');}};
  ws.onclose=function(){NET.connected=false;try{if(NET.hb)clearInterval(NET.hb);}catch(e){}};
}

function lbCreate(){
  var name=getLbName(),server=getLbServer();
  if(!server){lbMsg('请填写服务器地址');return;}
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code='';
  for(var i=0;i<6;i++)code+=chars[~~(Math.random()*chars.length)];
  lbMsg('连接中…'); gOn=0;
  netConnect(server,function(){
    NET.mode='host';NET.server=server;NET.name=name;NET.room=code;NET.isHost=true;
    NET.players={};NET.desireSide=0;
    netSend({t:'create',room:code,name:name,v:RA_VER});
  },function(err){lbMsg(err);NET.mode='off';gOn=1;});
}
function lbJoin(){

    NET.players={};

function hostStart(){
  if(!NET.isHost)return;
  var list=[],cid;
  for(cid in NET.players)list.push(NET.players[cid]);
  list.sort(function(a,b){return (b.isHost?1:0)-(a.isHost?1:0);});
  var used=[false,false,false,false],assign={};
  for(var i=0;i<list.length;i++){
    var p=list[i],sd=p.side|0; if(sd<0||sd>3)sd=0;
    if(used[sd]){for(var k=0;k<4;k++)if(!used[k]){sd=k;break;}}
    used[sd]=true;assign[p.cid]=sd;p.side=sd;
  }
  humanSide=[used[0],used[1],used[2],used[3]];
  mySide=assign[NET.cid]||0;
  NET.mode='host';NET.started=true;
  genMap();
  netSend({t:'start',v:RA_VER,human:humanSide,sides:assign,
    ais:ais.map(function(a){return a?a.strategy:null;}),
    map:mData,ores:ores.map(function(o){return [o.x,o.y,o.a];}),
    blds:blds.map(function(b){return [b.id,b.side,b.type,b.x,b.y,b.hp,b.mhp,1,b.bt,b.sz,0];}),
    miners:miners.map(function(m){return [m.id,m.side,m.x,m.y,m.hp,m.carry,m.st];}),
    gold:sideGold,weather:weather,gt:gt,mType:mType});
  closeLobby();
}

function onNetMsg(m){
  switch(m.t){
    case 'err': lbMsg(m.msg||'错误');break;
    case 'created':
      NET.cid=m.cid;NET.isHost=true;
      NET.players[m.cid]={name:NET.name,cid:m.cid,side:NET.desireSide,isHost:true};
      showRoomView();lbRender();break;
    case 'joined':
      NET.cid=m.cid;NET.isHost=false;showRoomView();
      NET.players[m.cid]={name:NET.name,cid:m.cid,side:NET.desireSide,isHost:false};
      lbRender();break;
    case 'joinc':
      if(NET.isHost){NET.players[m.cid]={name:m.name,cid:m.cid,side:m.side|0,isHost:false};lbBroadcast();lbRender();}break;
    case 'leave':
      if(NET.isHost){
        var lv=NET.players[m.cid];
        if(lv&&NET.started){humanSide[lv.side]=false;netSend({t:'lob',k:'left',side:lv.side});}
        delete NET.players[m.cid];lbBroadcast();lbRender();
      }break;
    case 'lob':
      if(NET.isHost){if(m.k==='side'&&NET.players[m.cid]){NET.players[m.cid].side=m.side|0;lbBroadcast();lbRender();}}
      else if(m.k==='roster'){NET.players=m.players||{};lbRender();}
      else if(m.k==='left'){humanSide[m.side]=false;}break;
    case 'start':
      if(!NET.isHost){if(m.v&&m.v!==RA_VER)lbMsg('版本不一致，可能出现异常');guestStart(m);}
      break;
    case 'snap': if(NET.mode==='guest')guestApply(m);break;
    case 'over': if(NET.mode==='guest')guestOver(m);break;
    case 'cmd': if(NET.isHost)hostApplyCmd(m);break;
    case 'hostgone':
      lbMsg('房主已离开，游戏结束');
      gOver=1;document.getElementById('got').textContent='💀 房主离开';document.getElementById('gom').textContent='游戏结束';document.getElementById('gameover').style.display='flex';
      break;
  }
}

// ---- 指令（客人上行 / 房主下行）----
function idsOf(us){var a=[];for(var i=0;i<us.length;i++)a.push(us[i].id);return a;}
function netCmd(o){if(NET.mode==='guest'){o.t='cmd';netSend(o);}}
function applyMove(us,x,y){us.forEach(function(u,i){var ang=i/us.length*PI*2;u.tx=x+Math.cos(ang)*15*(i>0?1:0);u.ty=y+Math.sin(ang)*15*(i>0?1:0);u.tgt=null;u.ord='m';u.wSide=undefined;u._path=null;u._stuckN=0;});}
function applyAttack(us,tgt){us.forEach(function(s){s.tgt=tgt;s.ord='a';s.tx=undefined;s.ty=undefined;s._path=null;s.wSide=undefined;});}
function orderMove(us,x,y){if(NET.mode==='guest')netCmd({k:'move',u:idsOf(us),x:x,y:y});else applyMove(us,x,y);}
function orderAttack(us,tgt,kind){if(NET.mode==='guest')netCmd({k:'attack',u:idsOf(us),kt:kind,tid:tgt.id});else applyAttack(us,tgt);}
function unitsOfSide(side,ids){var out=[],map={};for(var i=0;i<ids.length;i++)map[ids[i]]=1;for(var j=0;j<units.length;j++){var u=units[j];if(u.hp>0&&u.side===side&&map[u.id])out.push(u);}return out;}
function findEnt(kind,id){var arr=kind==='unit'?units:kind==='bld'?blds:miners;for(var i=0;i<arr.length;i++)if(arr[i].id===id&&arr[i].hp>0)return arr[i];return null;}
function hostApplyCmd(m){
  if(!NET.started)return;
  var p=NET.players[m.cid];if(!p)return;var side=p.side;
  if(m.k==='move'){applyMove(unitsOfSide(side,m.u||[]),m.x,m.y);}
  else if(m.k==='attack'){var tg=findEnt(m.kt,m.tid);if(tg)applyAttack(unitsOfSide(side,m.u||[]),tg);}
  else if(m.k==='build'){tryHostBuild(side,m.type,m.x,m.y);}
  else if(m.k==='train'){tryHostTrain(side,m.type);}
  else if(m.k==='miner'){hostMinerRedirect(side,m.x,m.y);}
  hostSnapshot();
}
function hostMinerRedirect(side,x,y){
  miners.forEach(function(m){
    if(m.side!==side||m.hp<=0)return;
    if(dist(m,{x:x,y:y})<400){m.st='idle';m.carry=0;m._path=null;m._tx=x+(Math.random()-0.5)*100;m._ty=y+(Math.random()-0.5)*100;}
  });
}
function tryHostBuild(side,type,x,y){
  var d=BD[type];if(!d)return;
  if(sideGold[side]<d.g||!techUnlocked(type,side)||!canBuild(type,x,y,side))return;
  sideGold[side]-=d.g;if(side===mySide)gold=sideGold[side];
  var nb=addB(type,x,y,side);nb.ready=0;nb.bt=120;
  if(type==='tunnel'){var tx2=~~(x/T),ty2=~~(y/T);for(var dx2=-1;dx2<=1;dx2++)for(var dy2=-1;dy2<=1;dy2++){if(ty2+dy2>=0&&ty2+dy2<mData.length&&tx2+dx2>=0&&tx2+dx2<mData[0].length)mData[ty2+dy2][tx2+dx2]=0;}}
}
function tryHostTrain(side,type){
  var dd=UD[type];if(!dd)return;
  var c=unitCost(dd,side);
  var src=blds.filter(function(b){return b.type===dd.rq&&b.side===side&&b.hp>0&&b.ready;})[0];
  if(!src||sideGold[side]<c)return;
  sideGold[side]-=c;if(side===mySide)gold=sideGold[side];
  var ang=Math.random()*PI*2;spawnUnit(type,src.x+Math.cos(ang)*120,src.y+Math.sin(ang)*120,side);
}

// ---- 快照（房主→客人）----
function hostSnapshot(){
  var i,U=[],B=[],M=[],O=[],Bl=[],S=[],Nk=[];
  for(i=0;i<units.length;i++){var u=units[i];if(u.hp<=0)continue;U.push([u.id,u.side,u.type,~~u.x,~~u.y,u.hp,~~u.mhp,u.lv||0,u.kills||0,u.cooldown>0?1:0,u.ord==='m'?1:u.ord==='a'?2:0]);}
  for(i=0;i<blds.length;i++){var b=blds[i];if(b.hp<=0)continue;B.push([b.id,b.side,b.type,~~b.x,~~b.y,b.hp,~~b.mhp,b.ready?1:0,b.bt||0,b.sz,b.nukeCd||0]);}
  for(i=0;i<miners.length;i++){var mi=miners[i];if(mi.hp<=0)continue;M.push([mi.id,mi.side,~~mi.x,~~mi.y,mi.hp,mi.carry,mi.st]);}
  for(i=0;i<ores.length;i++)O.push([~~ores[i].x,~~ores[i].y,ores[i].a]);
  for(i=0;i<bullets.length;i++){var bl=bullets[i];Bl.push([~~bl.x,~~bl.y,~~bl.tx,~~bl.ty,bl.side]);}
  for(i=0;i<supplies.length;i++)S.push([~~supplies[i].x,~~supplies[i].y,supplies[i].val,supplies[i].life]);
  for(i=0;i<nukes.length;i++){var nk=nukes[i];Nk.push([~~nk.sx,~~nk.sy,~~nk.tx,~~nk.ty,~~nk.x,~~nk.y,nk.t,nk.dur,nk.radius,nk.side]);}
  var pw=[0,0,0,0],pu=[0,0,0,0],al=[0,0,0,0];
  for(i=0;i<blds.length;i++){var bb=blds[i];if(bb.hp>0){al[bb.side]=1;if(bb.ready){pw[bb.side]+=BD[bb.type].gn;pu[bb.side]+=BD[bb.type].us;}}}
  netSend({t:'snap',U:U,B:B,M:M,O:O,Bl:Bl,S:S,Nk:Nk,g:sideGold,pw:pw,pu:pu,al:al,w:weather,gt:gt,ov:gOver,win:gOver?NET.winSide:-1});
}

// ---- 客人应用 ----
function reconcile(store,recs,up){
  var seen={},arr=[],r,id,o;
  for(var i=0;i<recs.length;i++){r=recs[i];id=r[0];o=store[id];if(!o){o={id:id};store[id]=o;up(o,r,true);}else up(o,r,false);seen[id]=1;arr.push(o);}
  for(var k in store)if(!seen[k])delete store[k];
  return arr;
}
function upU(o,r,isNew){var d=UD[r[2]]||{};o.type=r[2];o.side=r[1];o._tx=r[3];o._ty=r[4];if(isNew){o.x=r[3];o.y=r[4];o.rng=d.rng||100;o.atk=d.atk||0;o.spd=d.spd||1;o.rt=d.rt||30;o.ar=d.ar||'lt';}o.hp=r[5];o.mhp=r[6];o.lv=r[7];o.kills=r[8];o.cooldown=r[9];o.ord=r[10]===1?'m':r[10]===2?'a':null;}
function upB(o,r,isNew){var d=BD[r[2]]||{};o.type=r[2];o.side=r[1];o.x=r[3];o.y=r[4];o.hp=r[5];o.mhp=r[6];o.ready=r[7];o.bt=r[8];o.sz=r[9];o.nukeCd=r[10];if(isNew){o.atk=d.atk||0;o.art=d.art||0;}}
function upM(o,r,isNew){o.side=r[1];o._tx=r[2];o._ty=r[3];if(isNew){o.x=r[2];o.y=r[3];}o.hp=r[4];o.carry=r[5];o.st=r[6];}
function guestApply(m){
  units=reconcile(NET.uStore,m.U,upU);
  blds=reconcile(NET.bStore,m.B,upB);
  miners=reconcile(NET.mStore,m.M,upM);
  if(NET.ghosts.length){
    var _now=Date.now(),_keep=[];
    for(var _gi=0;_gi<NET.ghosts.length;_gi++){
      var _g=NET.ghosts[_gi],_mt=false;
      for(var _bi=0;_bi<blds.length;_bi++){var _b=blds[_bi];if(_b.side===_g.side&&_b.type===_g.type&&Math.abs(_b.x-_g.x)<80&&Math.abs(_b.y-_g.y)<80){_mt=true;break;}}
      if(!_mt&&_now-_g.t<4000)_keep.push(_g);
    }
    NET.ghosts=_keep;
    for(var _gj=0;_gj<NET.ghosts.length;_gj++)blds.push(NET.ghosts[_gj]);
  }
  ores=[];for(var i=0;i<m.O.length;i++)ores.push({x:m.O[i][0],y:m.O[i][1],a:m.O[i][2],m:1500});
  bullets=[];for(i=0;i<m.Bl.length;i++)bullets.push({x:m.Bl[i][0],y:m.Bl[i][1],tx:m.Bl[i][2],ty:m.Bl[i][3],side:m.Bl[i][4],spd:5,life:30,dmg:0});
  supplies=[];for(i=0;i<m.S.length;i++)supplies.push({x:m.S[i][0],y:m.S[i][1],val:m.S[i][2],life:m.S[i][3]});
  nukes=[];for(i=0;i<m.Nk.length;i++){var n=m.Nk[i];nukes.push({sx:n[0],sy:n[1],tx:n[2],ty:n[3],x:n[4],y:n[5],t:n[6],dur:n[7],radius:n[8],side:n[9]});}
  sideGold=m.g.slice();NET.pw=m.pw;NET.pu=m.pu;NET.alive=m.al||[1,1,1,1];
  weather=m.w;gt=m.gt;
  if(m.win>=0&&!gOver)guestOver({win:m.win});
  else if(!NET.alive[mySide]&&!gOver){gOver=1;document.getElementById('got').textContent='💀 你已被淘汰';document.getElementById('gom').textContent='可以继续观战，或离开房间';document.getElementById('gameover').style.display='flex';}
}
function guestOver(m){
  if(gOver)return;
  gOver=(m.win===mySide)?2:1;
  document.getElementById('got').textContent=(m.win===mySide)?'🏆 胜利！':'💀 失败！';
  document.getElementById('gom').textContent=(m.win===mySide)?'你是最后的赢家':(m.win>=0?SIDES[m.win].n+'赢得了战争':'游戏结束');
  document.getElementById('gameover').style.display='flex';
}
function guestFrame(){
  var i,u,m2;
  for(i=0;i<units.length;i++){u=units[i];if(u._tx!==undefined){u.x+=(u._tx-u.x)*0.25;u.y+=(u._ty-u.y)*0.25;}}
  for(i=0;i<miners.length;i++){m2=miners[i];if(m2._tx!==undefined){m2.x+=(m2._tx-m2.x)*0.25;m2.y+=(m2._ty-m2.y)*0.25;}}
  for(i=bullets.length-1;i>=0;i--){var b=bullets[i],dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy)||1;if(d<10){bullets.splice(i,1);continue;}b.x+=dx/d*b.spd;b.y+=dy/d*b.spd;}
  updateParticles();
  var mm=~~(gt/3600),ss=~~((gt%3600)/60);
  document.getElementById('timer').textContent=mm+':'+(ss<10?'0':'')+ss;
  gold=sideGold[mySide];pwr=NET.pw?NET.pw[mySide]:0;pwrU=NET.pu?NET.pu[mySide]:0;
  buildPanels_update();updateSelInfo();updateResUI();
  selU=selU.filter(function(o){return units.indexOf(o)>=0;});
  if(selB&&blds.indexOf(selB)<0)selB=null;
}
function guestStart(m){
  humanSide=(m.human||[true,false,false,false]).slice();
  mySide=(m.sides&&m.sides[NET.cid]!==undefined)?m.sides[NET.cid]:0;
  mData=m.map;mType=m.mType||'symmetric';
  sideGold=(m.gold||[5000,5000,5000,5000]).slice();gold=sideGold[mySide];
  gt=m.gt||0;gOver=0;gOn=1;weather=m.weather||'clear';
  ores=[];for(var i=0;i<m.ores.length;i++)ores.push({x:m.ores[i][0],y:m.ores[i][1],a:m.ores[i][2]});
  NET.bStore={};NET.mStore={};NET.uStore={};
  blds=reconcile(NET.bStore,m.blds,upB);
  miners=reconcile(NET.mStore,m.miners,upM);
  units=[];bullets=[];parts=[];supplies=[];nukes=[];nukeFx=[];NET.ghosts=[];
  ais=[null,null,null,null];
  if(m.ais){for(i=0;i<4;i++)ais[i]=(!humanSide[i]&&m.ais[i])?{strategy:m.ais[i]}:null;}
  selU=[];selB=null;bldMode=null;
  var h=cornerOf(mySide);camX=h.x-W/2/camZ;camY=h.y-H/2/camZ;
  buildPanels();
  NET.mode='guest';NET.started=true;NET.pw=[0,0,0,0];NET.pu=[0,0,0,0];NET.alive=[1,1,1,1];
  closeLobby();
}

document.getElementById('lb-create').onclick=lbCreate;
document.getElementById('lb-join').onclick=lbJoin;
document.getElementById('lb-leave').onclick=lbLeave;
document.getElementById('lb-start').onclick=hostStart;
document.getElementById('lb-close').onclick=function(){if(!NET.started)closeLobby();else lbMsg('');};

genMap();
loadBldImgs();
tick();
</script></body></html>
