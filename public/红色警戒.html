function colorToTerrain(r,g,b){
  if(b>120&&b>r+30&&b>g+30) return 3;

}

function genSym(c,r){

    if(nx>0.82&&ny<0.18&&Math.random()<0.35)mData[y][x]=4;
    if(nx<0.18&&ny>0.82&&Math.random()<0.35)mData[y][x]=4;
    if(nx>0.82&&ny>0.82&&Math.random()<0.35)mData[y][x]=4;
    if(Math.abs(ny-0.5)<0.07&&nx>0.15&&nx<0.85&&Math.random()<0.25)mData[y][x]=4;
    if(Math.abs(nx-0.35)<0.07&&Math.abs(ny-0.3)<0.1&&Math.random()<0.35)mData[y][x]=2;
    if(Math.abs(nx-0.65)<0.07&&Math.abs(ny-0.7)<0.1&&Math.random()<0.35)mData[y][x]=2;

function genLanes(c,r){

    var nx=x/c,ny=y/r;

function genOpen(c,r){

function findPath(sx,sy,tx,ty){
  var sgx=~~(sx/T),sgy=~~(sy/T),tgx=~~(tx/T),tgy=~~(ty/T);
  if(sgx===tgx&&sgy===tgy)return null;
  if(tgy<0||tgy>=mData.length||tgx<0||tgx>=mData[0].length)return null;
  if(tileBlockedByBld(tgx,tgy,false,tgx,tgy)){
    var found=false;
    for(var rad=1;rad<=3&&!found;rad++){
      for(var dy=-rad;dy<=rad&&!found;dy++)for(var dx=-rad;dx<=rad&&!found;dx++){
        if(Math.abs(dx)!==rad&&Math.abs(dy)!==rad)continue;
        var cxg=tgx+dx,cyg=tgy+dy;
        if(cyg<0||cyg>=mData.length||cxg<0||cxg>=mData[0].length)continue;
        if(!tileBlockedByBld(cxg,cyg,false,tgx,tgy)&&mData[cyg][cxg]!==3&&mData[cyg][cxg]!==4&&mData[cyg][cxg]!==9){
          tgx=cxg;tgy=cyg;found=true;
        }
      }
    }
    if(!found)return null;
  }

      var px=src.x+Math.cos(ang)*rr*28,py=src.y+Math.sin(ang)*rr*28;
      if(!passable(px,py))continue;
      var crowded=0;
      for(var i=0;i<units.length;i++){
        if(units[i].hp>0&&Math.hypot(units[i].x-px,units[i].y-py)<50)crowded++;
      }
      for(var i=0;i<miners.length;i++){
        if(miners[i].hp>0&&Math.hypot(miners[i].x-px,miners[i].y-py)<40)crowded++;
      }
      var score=100-crowded*30-rr*2;
      if(score>bestScore){bestScore=score;best={x:px,y:py};}
      if(crowded===0&&rr<=3)return best;
    }
  }
  return best||{x:src.x+Math.cos(baseAng)*(src.sz*T/2+40),y:src.y+Math.sin(baseAng)*(src.sz*T/2+40)};
}
function captureHQ(hq,newSide){
  var oldSide=hq.side;
  var keepHQs=[];
  blds.forEach(function(b){if(b.type==='hq'&&b.side===oldSide&&b.hp>0&&b!==hq)keepHQs.push(b);});
  var lastHQ=keepHQs.length===0;
  if(lastHQ){
    sideGold[newSide]+=sideGold[oldSide];
    sideGold[oldSide]=0;
  }
  function nearCaptured(obj){
    var dCap=dist(obj,hq);
    for(var i=0;i<keepHQs.length;i++){
      if(dist(obj,keepHQs[i])<=dCap)return false;
    }
    return true;
  }
  blds.forEach(function(b){
    if(b.side===oldSide&&b.hp>0&&b!==hq&&nearCaptured(b))b.side=newSide;
  });
  units.forEach(function(u){
    if(u.side===oldSide&&u.hp>0&&nearCaptured(u))u.side=newSide;
  });
  miners.forEach(function(m){
    if(m.side===oldSide&&m.hp>0&&nearCaptured(m))m.side=newSide;
  });
  hq.hp=Math.floor(hq.mhp*0.3);hq.side=newSide;
  units.forEach(function(u){if(u.side===newSide&&u.wSide===oldSide)u.wSide=undefined;});
  units.forEach(function(u){
    if(u.side===newSide&&u.tgt===hq){u.tgt=null;u.tx=undefined;u.ty=undefined;u._path=null;}
  });
  units.forEach(function(u){
    if(u.tgt&&u.tgt.side!==undefined&&u.tgt.side===u.side){u.tgt=null;u.tx=undefined;u.ty=undefined;u._path=null;}
  });
  parts.push({x:hq.x,y:hq.y,vx:0,vy:0,life:60,col:SIDES[newSide].c,sz:20});
}
function dealDmg(target,dmg){
  target.hp-=dmg;
  if(target.hp<=0&&(target.type==='apc'||target.type==='heli')&&target.cargo&&target.cargo.length){
    for(var _ci=0;_ci<target.cargo.length;_ci++){
      var _cu=target.cargo[_ci];
      _cu.riding=0;_cu.x=target.x+(Math.random()-.5)*50;_cu.y=target.y+(Math.random()-.5)*50;
      _cu.hp=Math.max(1,~~(_cu.hp*0.5));_cu.ord=null;_cu.tgt=null;_cu._path=null;_cu.tx=undefined;_cu.ty=undefined;
    }
    target.cargo.length=0;
  }
  if(target.hp<=0){
    target.hp=0;
    if(target.x!==undefined)parts.push({x:target.x,y:target.y,vx:0,vy:0,life:40,col:'#f80'});
    if(target.type==='hq'){
      var attacker=-1;
      for(var i=units.length-1;i>=0;i--){
        if(units[i].hp<=0)continue;
        if(Math.abs(units[i].x-target.x)<300&&Math.abs(units[i].y-target.y)<300&&units[i].side!==target.side){attacker=units[i].side;break;}
      }
      if(attacker>=0&&attacker!==target.side){
        captureHQ(target,attacker);
      }
    }
    sideGold[target.side]+=50;
    if(target.side===mySide)gold=sideGold[mySide];
    var killer=findKiller(target.side,target);
    if(killer&&killer.hp>0){
      killer.ex=(killer.ex||0)+50;
      killer.kills=(killer.kills||0)+1;
      if(killer.kills>=3)levelUpUnit(killer);
    }
  }
}

// 找到击杀者
function findKiller(deadSide,target){
  var best=null,bd=99999;
  for(var i=0;i<units.length;i++){
    var u=units[i];
    if(u.hp<=0||u.side===deadSide||u.riding)continue;
    if(u.tgt===target)return u;
    var d=dist(u,target);
    if(d<bd&&d<u.rng+60){bd=d;best=u;}
  }
  return best;
}

// 单位升级
function levelUpUnit(u){
  u.lv=(u.lv||0)+1;
  u.ex=0;
  u.kills=0;
  if(u.type==='heli'&&u.cap){u.cap+=2;}
  u.atk=Math.floor(u.atk*1.15)+2;
  u.mhp=Math.floor(u.mhp*1.1);
  u.hp=u.mhp;
  u.rng+=5;
  parts.push({x:u.x,y:u.y,vx:0,vy:-1,life:40,col:'#ff0',sz:6});
}
function hasLab(side){return blds.some(function(b){return b.type==='lab'&&b.side===side&&b.hp>0;});}

function moveTowMiner(o,tx,ty,spd){
  var dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy);
  if(d<3)return true;
  if(!passable(o.x,o.y)){
    var ang=Math.random()*PI*2;
    for(var a=0;a<8;a++){
      var ta=ang+a*PI/4,tx2=o.x+Math.cos(ta)*T*0.6,ty2=o.y+Math.sin(ta)*T*0.6;
      if(passable(tx2,ty2)){o.x=tx2;o.y=ty2;return false;}
    }
    return false;
  }
  if(!o._path||o._pi===undefined||Math.random()<0.03){
    var p=findPath(o.x,o.y,tx,ty);
    if(p&&p.length>0){o._path=p;o._pi=0;}
  }
  var step=null;
  if(o._path&&o._pi<o._path.length){
    var wp=o._path[o._pi];
    if(Math.hypot(wp.x-o.x,wp.y-o.y)<15)o._pi++;
    if(o._pi<o._path.length)step=o._path[o._pi];
  }
  var moved=false;
  if(step){
    var ndx=step.x-o.x,ndy=step.y-o.y,nd=Math.hypot(ndx,ndy);
    if(nd>2){
      var sp=spd*tSpd(o.x,o.y),nx=o.x+ndx/nd*sp,ny=o.y+ndy/nd*sp;
      if(passable(nx,o.y)&&passable(o.x,ny)){o.x=nx;o.y=ny;moved=true;}
      else if(passable(nx,o.y)){o.x=nx;moved=true;}
      else if(passable(o.x,ny)){o.y=ny;moved=true;}
    }
  }else{
    var sp2=spd*tSpd(o.x,o.y),nx2=o.x+dx/d*sp2,ny2=o.y+dy/d*sp2;
    if(passable(nx2,ny2)){o.x=nx2;o.y=ny2;moved=true;}
    else if(passable(nx2,o.y)){o.x=nx2;moved=true;}
    else if(passable(o.x,ny2)){o.y=ny2;moved=true;}
  }
  if(!moved){
    var sp3=spd*tSpd(o.x,o.y);
    var ang2=Math.atan2(dy,dx);
    for(var a2=-2;a2<=2;a2++){
      var ta2=ang2+a2*0.4,nx3=o.x+Math.cos(ta2)*sp3,ny3=o.y+Math.sin(ta2)*sp3;
      if(passable(nx3,ny3)){o.x=nx3;o.y=ny3;moved=true;break;}
    }
  }
  return false;
}
function updateMiners(){
  miners.forEach(function(m){
    if(m.hp<=0)return;
    if(!m.home||m.home.hp<=0){
      var refs=blds.filter(function(b){return b.type==='refinery'&&b.side===m.side&&b.hp>0;});
      m.home=refs.length>0?refs[0]:null;
    }
    if(!m.home)return;
    // stuck detection
    if(m._lastX!==undefined&&Math.abs(m.x-m._lastX)<0.5&&Math.abs(m.y-m._lastY)<0.5){
      m._stuckCount=(m._stuckCount||0)+1;
      if(m._stuckCount>60){
        // teleport slightly to escape
        var ang=Math.random()*PI*2;m.x+=Math.cos(ang)*30;m.y+=Math.sin(ang)*30;
        m._stuckCount=0;m._path=null;
      }
    }else{m._stuckCount=0;}
    m._lastX=m.x;m._lastY=m.y;
    if(m.st==='idle'){
      if(m.carry>0){
        if(dist(m,m.home)<60){
          sideGold[m.side]+=m.carry;
          if(m.side===mySide)gold=sideGold[mySide];
          m.carry=0;
        }else{moveTowMiner(m,m.home.x,m.home.y,m.spd);}
      }else{
        var best=null,bd=99999;
        for(var i=0;i<ores.length;i++){
          if(ores[i].a<=0)continue;
          var d=Math.hypot(m.x-ores[i].x,m.y-ores[i].y);
          if(d<bd){bd=d;best=ores[i];}
        }
        if(best){
          if(bd<30){var take=Math.min(80,best.a);m.carry+=take;best.a-=take;if(m.carry>0)m.st='return';}
          else{moveTowMiner(m,best.x,best.y,m.spd);}
        }else{
          if(Math.random()<0.05){var ang=Math.random()*PI*2;m._tx=m.home.x+Math.cos(ang)*200;m._ty=m.home.y+Math.sin(ang)*200;}
          if(m._tx!==undefined)moveTowMiner(m,m._tx,m._ty,m.spd*0.5);
        }
      }
    }else if(m.st==='return'){
      if(m.carry<=0){m.st='idle';return;}
      if(dist(m,m.home)<60){sideGold[m.side]+=m.carry;if(m.side===mySide)gold=sideGold[mySide];m.carry=0;m.st='idle';}
      else{moveTowMiner(m,m.home.x,m.home.y,m.spd);}
    }
  });
}

function fireUnit(u,t){
  if(u.type==='tesla')return;

    return;
  }
  if(u.type==='ship'){
    var _sn=3+~~(Math.random()*3);
    for(var _sj=0;_sj<_sn;_sj++)bullets.push({x:u.x,y:u.y,tx:t.x+(Math.random()-0.5)*40,ty:t.y+(Math.random()-0.5)*40,spd:6,dmg:u.atk,side:u.side,life:60,t:t,ox:u.x,oy:u.y});
    return;
  }
  bullets.push({x:u.x,y:u.y,tx:t.x,ty:t.y,spd:tesla?7:5,dmg:u.atk,side:u.side,life:tesla?45:60,tesla:tesla?1:0,t:t,ox:u.x,oy:u.y});
}
function updateUnits(){
  units.forEach(function(u){
    if(u.hp<=0)return;
    u.cooldown=u.cooldown?u.cooldown-1:0;
    if(u._chute>0){
      u._chute--;
      if(u._chute===0&&u._dust!==1){
        u._dust=1;
        for(var pdi=0;pdi<6;pdi++)parts.push({x:u.x+(Math.random()-0.5)*30,y:u.y+(Math.random()-0.5)*16,vx:(Math.random()-0.5),vy:-1,life:18,col:'#ccbfae',sz:3});
      }
    }
    if(u._fz>gt)return;
    if(u._tin){
      var tin=u._tin;
      var fromB=null,toB=null;
      for(var ti=0;ti<blds.length;ti++){
        if(blds[ti].id===tin.fid)fromB=blds[ti];
        if(blds[ti].id===tin.tid)toB=blds[ti];
      }
      if(!toB||toB.hp<=0){
        if(fromB&&fromB.hp>0){u.x=fromB.x;u.y=fromB.y;}
        u._tin=null;u._chute=75;
      }else{
        tin.p+=0.025;
        if(tin.p>=1){
          u.x=toB.x;u.y=toB.y;u._tin=null;u._chute=75;
          parts.push({x:u.x,y:u.y,vx:0,vy:-1,life:20,col:'#0f0',sz:6});
        }else{
          u.x=tin.sx+(toB.x-tin.sx)*tin.p;
          u.y=tin.sy+(toB.y-tin.sy)*tin.p;
        }
      }
      return;
    }
    if(u.type==='apc'||u.type==='heli'||u.water){
      var b0=u.batk!==undefined?u.batk:u.atk;var bonus=0;u.tsla=0;
      if(u.cargo)for(var ci=0;ci<u.cargo.length;ci++){
        var cu=u.cargo[ci];bonus+=Math.floor((cu.atk||0)*0.5);
        if(cu.type==='tesla')u.tsla=1;
      }
      u.atk=b0+bonus;
      var engIn=u.cargo&&u.cargo.some(function(c){return c.type==='engineer'||c.type==='hero';});
      if(engIn&&u.hp<u.mhp&&gt%12===0)u.hp=Math.min(u.mhp,u.hp+3);
    }
    if(u.ord==='load'){
      var la=null;
      for(var lj=0;lj<units.length;lj++){if(units[lj].id===u.loadTo&&units[lj].hp>0){la=units[lj];break;}}
      if(!la||!la.cargo||la.cargo.length>=(la.cap||4)){u.ord=null;u.loadTo=undefined;}
      else if(dist(u,la)<=(la.ar==='air'?160:52)){la.cargo.push(u);u.riding=la;u.ord=null;u.loadTo=undefined;u.tgt=null;u._path=null;u.tx=undefined;u.ty=undefined;}
      else moveTow(u,la.x,la.y,u.spd);
      return;
    }

    // ===== 玩家移动命令：优先执行，仅对射程内敌人开火，不追击 =====
    if(isHumanSide(u.side)&&u.ord==='m'){
      if(u.tx===undefined){u.ord=null;}
      else{
        var fireT=null,fd=u.rng;var _ha2=canHitAir(u);
        for(var i=0;i<units.length;i++){
          var e=units[i];
          if(e.side===u.side||e.hp<=0||(e.type==='spy'&&!spyVis(e)))continue;
          if(!_ha2&&(e.ar==='air'||e.fly))continue;
          var dd=dist(u,e);
          if(dd<fd){fd=dd;fireT=e;}
        }
        if(fireT&&u.cooldown<=0){
          fireUnit(u,fireT);
          u.cooldown=u.rt;
        }
        if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;u.ord=null;u._path=null;if(u.type==='heli'&&u.cargo&&u.cargo.length)applyUnload(u);}
        return;
      }
    }

    // ===== 磁爆兵：范围内敌方单位/建筑持续5秒即消灭（基地HQ无效） =====
    if(u.type==='tesla'&&!u.riding&&u.hp>0){
      if(!u._mList)u._mList={};
      var _nl={};
      for(var mi=0;mi<units.length;mi++){
        var mu=units[mi];
        if(mu===u||mu.side===u.side||mu.hp<=0||mu.riding||mu.fly)continue;
        if(dist(u,mu)<=u.rng){
          var mid=mu.id;
          _nl['u'+mid]=1;
          mu._fz=gt+3;
          u._mList['u'+mid]=(u._mList['u'+mid]||0)+1;
          if(u._mList['u'+mid]>=300){
            mu.hp=0;
            parts.push({x:mu.x,y:mu.y,vx:0,vy:0,life:45,col:'#4df',sz:18});
            if(isHumanSide(mu.side)){atkAlert.push({x:mu.x,y:mu.y,ox:u.x,oy:u.y,t:100});if(atkAlert.length>20)atkAlert.shift();}
          }
        }
      }
      for(var bi=0;bi<blds.length;bi++){
        var tb=blds[bi];
        if(tb.side===u.side||tb.hp<=0||tb.type==='hq')continue;
        var bsz=tb.sz*T/2;
        if(Math.abs(tb.x-u.x)<=u.rng+bsz&&Math.abs(tb.y-u.y)<=u.rng+bsz){
          var bid=tb.id;
          _nl['b'+bid]=1;
          u._mList['b'+bid]=(u._mList['b'+bid]||0)+1;
          if(u._mList['b'+bid]>=300){
            tb.hp=0;
            parts.push({x:tb.x,y:tb.y,vx:0,vy:0,life:50,col:'#4df',sz:24});
            if(isHumanSide(tb.side)){atkAlert.push({x:tb.x,y:tb.y,ox:u.x,oy:u.y,t:100});if(atkAlert.length>20)atkAlert.shift();}
          }
        }
      }
      u._mList=_nl;
    }
    // ===== 警犬：侦测附近敌方间谍 =====
    if(u.type==='dog'&&!u.riding){
      for(var i=0;i<units.length;i++){var e=units[i];
        if(e.type==='spy'&&e.side!==u.side&&e.hp>0&&dist(u,e)<220)e._rev=gt;}
    }

    // ===== 间谍：伪装潜入，策反敌方建筑（基地除外） =====
    if(u.type==='spy'&&!u.riding){
      if(u._dSide===undefined){
        var nbs=null,nd=1e9;
        for(var i=0;i<blds.length;i++){var b=blds[i];
          if(b.side===u.side||b.hp<=0)continue;
          var d2=dist(u,b);if(d2<nd){nd=d2;nbs=b;}}
        u._dSide=nbs?nbs.side:((u.side+1)%SIDES.length);
      }
      var eU=null,eD=1e9;
      for(var i=0;i<units.length;i++){var e=units[i];
        if(e.side===u.side||e.hp<=0||e.riding)continue;
        var d2=dist(u,e);if(d2<eD){eD=d2;eU=e;}}
      if(eU&&eD<=90&&!spyVis(u)){
        if(u._svTgt!==eU){u._svTgt=eU;u._svT=0;}
        u._svT=(u._svT||0)+1;
        if(gt%8===0)parts.push({x:eU.x,y:eU.y-14,vx:(Math.random()-0.5)*2,vy:-1,life:16,col:'#f0f',sz:3});
        if(u._svT>=300){
          var wasH=isHumanSide(eU.side);
          eU.side=u.side;eU.tgt=null;eU.tx=undefined;eU.ty=undefined;eU._path=null;eU.ord=null;
          u._svT=0;u._svTgt=null;
          parts.push({x:eU.x,y:eU.y,vx:0,vy:0,life:40,col:'#f0f',sz:14});
          if(wasH){atkAlert.push({x:eU.x,y:eU.y,ox:u.x,oy:u.y,t:100});if(atkAlert.length>20)atkAlert.shift();}
        }
        return;
      }
      if(!eU||eD>90)u._svT=0;
      var sT=null;
      if(u.tgt&&u.tgt.hp>0&&blds.indexOf(u.tgt)>=0&&u.tgt.side!==u.side&&u.tgt.type!=='hq')sT=u.tgt;
      if(!sT){
        var sb=null,sd=1e9;
        for(var i=0;i<blds.length;i++){var b=blds[i];
          if(b.side===u.side||b.hp<=0||b.type==='hq'||!b.ready)continue;
          var d2=dist(u,b);if(d2<sd){sd=d2;sb=b;}}
        sT=sb;u.tgt=sT;
      }
      if(sT){
        var reach=sT.sz*T/2+40;
        if(dist(u,sT)<=reach){
          if(!spyVis(u)){
            u._cv=(u._cv||0)+1;
            if(gt%6===0)parts.push({x:sT.x+(Math.random()-0.5)*30,y:sT.y-sT.sz*T*0.4,vx:0,vy:-1,life:14,col:'#f0f',sz:3});
            if(u._cv>=300){
              var wasHB=isHumanSide(sT.side);
              sT.side=u.side;u._cv=0;u.tgt=null;
              parts.push({x:sT.x,y:sT.y,vx:0,vy:0,life:45,col:'#f0f',sz:16});
              if(wasHB){atkAlert.push({x:sT.x,y:sT.y,ox:u.x,oy:u.y,t:100});if(atkAlert.length>20)atkAlert.shift();}
            }
          }else u._cv=0;
        }else{
          u._cv=0;
          var angS=Math.atan2(u.y-sT.y,u.x-sT.x)+(u._stR||0);
          var axS=sT.x+Math.cos(angS)*reach,ayS=sT.y+Math.sin(angS)*reach;
          if(!passable(axS,ayS)){axS=sT.x;ayS=sT.y;}
          moveTow(u,axS,ayS,u.spd);
          u._st=(u._st||0)+1;
          if(u._st>60){u._stR=((u._stR||0)+2.0944)%6.2832;u._st=0;}
        }
        return;
      }
      return;
    }

    // ===== 玩家攻击命令：只打指定目标 =====
    if(isHumanSide(u.side)&&u.ord==='a'){
      var at=u.tgt;
      if(!at||at.hp<=0||(at.side!==undefined&&at.side===u.side)){
        u.ord=null;u.tgt=null;
      }else if(!canHitAir(u)&&(at.ar==='air'||at.fly)){
        u.ord=null;u.tgt=null;
      }else{
        var ad=dist(u,at);
        if(ad<=u.rng){
          u.tx=undefined;u.ty=undefined;u._path=null;
          if(u.cooldown<=0){
            fireUnit(u,at);
            u.cooldown=u.rt;
          }
        }else{moveTow(u,at.x,at.y,u.spd);}
        return;
      }
    }

    // ===== 工程师：有玩家指令听指令，否则自动维修 =====
    if(u.type==='engineer'){
      if(isHumanSide(u.side)&&u.tx!==undefined){
        if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;u._path=null;}
        return;
      }
      var repairTarget=null,repairBest=1e9;
      for(var i=0;i<blds.length;i++){
        var b=blds[i];
        if(b.side!==u.side||b.hp<=0||b.hp>=b.mhp-1)continue;
        var d2=dist(u,b);
        if(d2<repairBest){repairBest=d2;repairTarget=b;}
      }
      if(repairTarget){
        var reach=repairTarget.sz*T/2+130;
        if(repairBest<=reach){
          if(u.cooldown<=0){
            repairTarget.hp=Math.min(repairTarget.mhp,repairTarget.hp+3);
            u.cooldown=20;
          }
          if(gt%8===0)parts.push({x:repairTarget.x,y:repairTarget.y-reach*0.4,vx:(Math.random()-0.5)*2,vy:-1,life:20,col:'#0f0',sz:3});
        }else{
          var angR=Math.atan2(u.y-repairTarget.y,u.x-repairTarget.x);
          var angR2=angR+(u._stR||0);
          var ax=repairTarget.x+Math.cos(angR2)*reach;
          var ay=repairTarget.y+Math.sin(angR2)*reach;
          if(!passable(ax,ay)){ax=repairTarget.x;ay=repairTarget.y;}
          moveTow(u,ax,ay,u.spd);
          u._st=(u._st||0)+1;
          if(u._st>60){u._stR=((u._stR||0)+2.0944)%6.2832;u._st=0;}
        }
        return;
      }
      if(u.hp<u.mhp&&gt%30===0)u.hp=Math.min(u.mhp,u.hp+2);
      if(isHumanSide(u.side)&&u.tx!==undefined){if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;}}
      return;
    }

    // HQ defense: prioritize enemies near own HQ
    if(!isHumanSide(u.side)){
      var myHQ=blds.find(function(b){return b.type==='hq'&&b.side===u.side&&b.hp>0;});
      if(myHQ&&dist(u,myHQ)<400){
        var threat=units.find(function(e){return e.side!==u.side&&e.hp>0&&dist(e,myHQ)<350&&!(e.type==='spy'&&!spyVis(e));});
        if(threat){
          u.tgt=threat;
          var d=dist(u,threat);
          if(d<=u.rng){
            u.tx=undefined;u.ty=undefined;u._path=null;
            if(u.cooldown<=0){fireUnit(u,threat);u.cooldown=u.rt;}
          }else{moveTow(u,threat.x,threat.y,u.spd);}
          return;
        }
      }
    }
    var tgt=u.tgt;
    if(!tgt||tgt.hp<=0||dist(u,tgt)>u.rng*2||(u.wSide!==undefined&&tgt.side!==u.wSide&&tgt.side!==undefined)){
      var scanRng=u.tx!==undefined?(u.wSide!==undefined?u.rng*2:u.rng):u.rng*2.5;
      u.tgt=findTgt(u,scanRng);tgt=u.tgt;
    }
    if(tgt&&tgt.hp>0){
      var d=dist(u,tgt);
      if(d<=u.rng){
        u.tx=undefined;u.ty=undefined;u._path=null;
        if(u.cooldown<=0){fireUnit(u,tgt);u.cooldown=u.rt;}
      }else if(d<=u.rng*4||(u.wSide!==undefined&&tgt.side===u.wSide)){moveTow(u,tgt.x,tgt.y,u.spd);}
      else if(u.tx!==undefined){if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;}}
    }else if(u.tx!==undefined){if(moveTow(u,u.tx,u.ty,u.spd)){u.tx=undefined;u.ty=undefined;if(u.wSide!==undefined)u.wSide=undefined;}}
  });
}

function updateBullets(){

    var dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);
    if(d<8){
      var hitT=null;
      if(b.t){
        if(b.t.hp>0&&b.t.side!==b.side&&!b.t.riding&&!b.t._tin){dealDmg(b.t,b.dmg);hitT=b.t;}
      }else{
        var targets=units.concat(miners).concat(blds);
        for(var j=0;j<targets.length;j++){
          var t=targets[j];
          if(t.side===b.side||t.hp<=0||t.riding)continue;
          if(Math.abs(t.x-b.tx)<20&&Math.abs(t.y-b.ty)<20){dealDmg(t,b.dmg);hitT=t;break;}

        if(atkAlert.length>20)atkAlert.shift();

        var chained=0,pl2=units.concat(miners).concat(blds);
        for(var j2=0;j2<pl2.length&&chained<2;j2++){
          var e2=pl2[j2];
          if(e2.side===b.side||e2.hp<=0||e2.riding)continue;
          if(Math.abs(e2.x-b.tx)<100&&Math.abs(e2.y-b.ty)<100){
            dealDmg(e2,b.dmg*0.6);parts.push({x:e2.x,y:e2.y,vx:0,vy:0,life:14,col:'#4df',sz:5});chained++;
            if(isHumanSide(e2.side)){atkAlert.push({x:e2.x,y:e2.y,ox:(b.ox!==undefined?b.ox:b.x),oy:(b.oy!==undefined?b.oy:b.y),t:100});if(atkAlert.length>20)atkAlert.shift();}
          }
        }
        parts.push({x:b.tx,y:b.ty,vx:0,vy:0,life:18,col:'#4df',sz:7});
      }
      parts.push({x:b.x,y:b.y,vx:0,vy:0,life:15,col:SIDES[b.side]?SIDES[b.side].c:'#888'});
      bullets.splice(i,1);continue;

    var _st=Math.min(b.spd,d);b.x+=dx/d*_st;b.y+=dy/d*_st;b.life--;
    if(b.life<=0)bullets.splice(i,1);
  }
}
function updateParticles(){

function updateTurrets(){

    b._cd=(b._cd||0)-1;
    if(b._cd>0)return;
    var rng=b.type==='missile'?200:160;
    var maxTargets=b.type==='missile'?3:2;
    var targets=[];
    var scan=blds.filter(function(e){return e.side!==b.side&&e.hp>0;})
      .concat(units.filter(function(e){return e.side!==b.side&&e.hp>0&&!e.riding&&!(e.type==='spy'&&!spyVis(e));}))
      .concat(miners.filter(function(e){return e.side!==b.side&&e.hp>0;}));
    for(var i=0;i<scan.length&&targets.length<maxTargets;i++){
      var d=dist(b,scan[i]);

function pushUnits(){

  for(var i=0;i<all.length;i++){for(var j=i+1;j<all.length;j++){
    var a=all[i],b=all[j];
    if(a.hp<=0||b.hp<=0||a.riding||b.riding)continue;
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<14&&d>0.1){
      var p=(14-d)*0.4;
      var nax=a.x-dx/d*p,nay=a.y-dy/d*p,nbx=b.x+dx/d*p,nby=b.y+dy/d*p;
      if(passable(nax,nay))a.x=nax,a.y=nay;
      if(passable(nbx,nby))b.x=nbx,b.y=nby;
    }
  }}
  for(var i=0;i<all.length;i++){
    var u=all[i];
    if(u.hp<=0||u.riding||u.fly)continue;
    if(!passable(u.x,u.y)){
      var ang=Math.random()*PI*2;
      for(var a=0;a<8;a++){
        var ta=ang+a*PI/4,tx=u.x+Math.cos(ta)*T*0.8,ty=u.y+Math.sin(ta)*T*0.8;
        if(passable(tx,ty)){u.x=tx;u.y=ty;u._path=null;u._stuckN=0;break;}
      }
    }
    for(var bi=0;bi<blds.length;bi++){
      var bb=blds[bi];
      if(bb.hp<=0)continue;
      var bsz=bb.sz*T/2+6;
      if(Math.abs(bb.x-u.x)<bsz&&Math.abs(bb.y-u.y)<bsz){
        var ba=Math.atan2(u.y-bb.y,u.x-bb.x);
        if(!ba&&ba!==0)ba=Math.random()*PI*2;
        u.x=bb.x+Math.cos(ba)*(bsz+8);
        u.y=bb.y+Math.sin(ba)*(bsz+8);
        u._path=null;u._stuckN=0;
      }
    }
  }
}

function spawnUnit(type,x,y,side){
  var d=UD[type];
  if(x===0&&y===0){var sp=findSpawnSpot(side);x=sp.x;y=sp.y;}
  for(var attempt=0;attempt<16;attempt++){
    var blocked=false;
    for(var i=0;i<blds.length;i++){var b=blds[i],bs=b.sz*T/2+8;if(Math.abs(b.x-x)<bs&&Math.abs(b.y-y)<bs){blocked=true;break;}}
    var _pw=d.water?{water:1}:null;
    if(!blocked&&passable(x,y,_pw))break;
    var ang=Math.random()*PI*2;var step=28+attempt*6;
    x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;
    x=Math.max(50,Math.min(MW-50,x));y=Math.max(50,Math.min(MH-50,y));
  }
  var _pw2=d.water?{water:1}:null,_fw=null;
  var _okSp=function(px,py){
    if(!passable(px,py,_pw2))return false;
    if(d.water&&(tileAt(px-34,py)!==3||tileAt(px+34,py)!==3||tileAt(px,py-34)!==3||tileAt(px,py+34)!==3))return false;
    for(var i2=0;i2<blds.length;i2++){
      var b2=blds[i2];if(b2.hp<=0)continue;
      var bs2=b2.sz*T/2+8;if(Math.abs(b2.x-px)<bs2&&Math.abs(b2.y-py)<bs2)return false;
    }
    return true;
  };
  if(!_okSp(x,y)){
    var _wmr=~~(Math.max(MW,MH)/T/2)+3;
    for(var r1=1;r1<=_wmr&&!_fw;r1++)for(var q1=0;q1<16&&!_fw;q1++){
      var a1=q1/16*PI*2,x1=x+Math.cos(a1)*r1*T,y1=y+Math.sin(a1)*r1*T;
      if(_okSp(x1,y1))_fw={x:x1,y:y1};
    }
    if(_fw){x=_fw.x;y=_fw.y;}
  }
  var u={id:_eid++,type:type,x:x,y:y,side:side,hp:d.hp,mhp:d.hp,atk:d.atk,spd:d.spd,rng:d.rng,rt:d.rt,ar:d.ar,cap:d.cap,
    fly:(type==='rocket'||type==='heli')?1:0,water:UD[type]&&UD[type].water?1:0,cargo:(type==='apc'||type==='heli')?[]:null,batk:d.atk,riding:0,
    cooldown:0,tx:undefined,ty:undefined,tgt:null,_path:null,_pi:0,ex:0,lv:0,kills:0,skillCd:600,wSide:undefined,_stuckN:0,_wfSide:Math.random()<0.5?1:-1,ord:null};
  if(type==='hero'){u.hp=2500;u.mhp=2500;u.atk=80;u.spd=1.5;u.rng=160;u.rt=35;u.ar='hv';}
  units.push(u);
  return u;
}

function whaleFree(x,y){
  if(x<60||x>MW-60||y<60||y>MH-60)return false;
  return tileAt(x,y)===3;
}
function relocateWhale(w){
  for(var i=0;i<300;i++){
    var x=60+Math.random()*(MW-120),y=60+Math.random()*(MH-120);
    if(whaleFree(x,y)){w.x=x;w.y=y;w.dir=Math.random()*PI*2;w.t=0;w.stuck=0;return;}
  }
}
function updateWhales(){
  for(var i=0;i<whales.length;i++){
    var w=whales[i];
    w.t+=0.016;
    if(w.t>150+Math.random()*100){w.t=0;w.dir+=(Math.random()-0.5)*1.2;}
    var spd=0.8;
    var nx=w.x+Math.cos(w.dir)*spd,ny=w.y+Math.sin(w.dir)*spd;
    if(whaleFree(nx,ny)){w.x=nx;w.y=ny;w.stuck=0;continue;}
    var moved=false;
    for(var k=1;k<=12&&!moved;k++){
      for(var sg=-1;sg<=1;sg+=2){
        var nd=w.dir+sg*k*0.3;
        var tx=w.x+Math.cos(nd)*spd,ty=w.y+Math.sin(nd)*spd;
        if(whaleFree(tx,ty)){w.x=tx;w.y=ty;w.dir=nd;moved=true;break;}
      }
    }
    if(moved){w.stuck=0;continue;}
    w.stuck=(w.stuck||0)+1;
    w.dir+=0.3;
    if(w.stuck>90)relocateWhale(w);
  }
}

function drawWhales(cx){

    cx.fillStyle='#2a4a5a';
    cx.beginPath();cx.moveTo(-sz*0.7,-sz*0.18);cx.lineTo(-sz*1.15,-sz*0.5);cx.lineTo(-sz*0.85,0);cx.lineTo(-sz*1.15,sz*0.5);cx.lineTo(-sz*0.7,sz*0.18);cx.fill();
    cx.fillStyle='rgba(255,255,255,0.25)';
    cx.beginPath();cx.arc(sz*0.55,-sz*0.08,sz*0.07,0,PI*2);cx.fill();

}

function goLandscape(){

    if(o&&o.lock){o.lock('landscape').catch(function(){alert('已进入全屏。若仍是竖屏，请手动旋转手机（如开启了自动旋转锁定请先关闭）');});}
    else{alert('已进入全屏。若仍是竖屏，请手动旋转手机（如开启了自动旋转锁定请先关闭）');}

  try{

function canBuild(type,x,y,side){
  side=(side===undefined)?mySide:side;
  var d=BD[type],sz=d.sz*T/2;

  if(!techUnlocked(type,side))return false;
  for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
    var tx=~~(x/T)+dx,ty=~~(y/T)+dy;
    if(ty<0||ty>=mData.length||tx<0||tx>=mData[0].length)return false;
    var t=mData[ty][tx];

    else if(t===3||t===4||t===9)return false;
  }
  for(var i=0;i<blds.length;i++){var b=blds[i];if(b.hp<=0)continue;if(Math.abs(b.x-x)<(b.sz*T/2+sz)&&Math.abs(b.y-y)<(b.sz*T/2+sz))return false;}

}

    document.getElementById('timer').style.color='#ffd700';
    setTimeout(function(){document.getElementById('timer').style.color='#8f8';},3000);
  }
  for(var i=supplies.length-1;i>=0;i--){
    var s=supplies[i];s.life--;
    if(s.life<=0){supplies.splice(i,1);continue;}
    var pick=null;
    var all=units.concat(miners);
    for(var j=0;j<all.length;j++){
      if(all[j].hp>0&&Math.hypot(all[j].x-s.x,all[j].y-s.y)<40){pick=all[j];break;}
    }
    if(pick){
      sideGold[pick.side]+=s.val;
      if(pick.ex!==undefined){pick.ex+=100;}
      parts.push({x:s.x,y:s.y,vx:0,vy:-2,life:50,col:'#ffd700',sz:8});
      supplies.splice(i,1);
    }
  }
}
function nukeExplode(nx,ny,side,radius){
  screenFlash=1;
  nukeFx.push({x:nx,y:ny,t:0,dur:100,radius:radius});
  for(var a=0;a<80;a++){
    var ang=Math.random()*PI*2,r=Math.sqrt(Math.random())*radius*0.4;
    parts.push({x:nx+Math.cos(ang)*r,y:ny+Math.sin(ang)*r,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-3,life:50,col:Math.random()<0.5?'#fff':'#ff0',sz:8+Math.random()*12});
  }
  for(var a=0;a<100;a++){
    var ang=Math.random()*PI*2,r=Math.sqrt(Math.random())*radius;
    parts.push({x:nx+Math.cos(ang)*r,y:ny+Math.sin(ang)*r,vx:(Math.random()-.5)*3,vy:-1-Math.random()*3,life:70+~~(Math.random()*40),col:Math.random()<0.4?'#f80':Math.random()<0.5?'#ff0':'#833',sz:5+Math.random()*10});
  }
  for(var a=0;a<40;a++){
    var ang=-PI/2+(Math.random()-.5)*0.8,r=Math.random()*40;
    parts.push({x:nx+Math.cos(ang)*r,y:ny-r*1.5,vx:(Math.random()-.5)*2,vy:-3-Math.random()*4,life:90,col:Math.random()<0.5?'#666':'#999',sz:12+Math.random()*18});
  }
  units.forEach(function(u){
    if(u.side===side||u.hp<=0)return;
    var d=Math.hypot(u.x-nx,u.y-ny);
    if(d<radius)dealDmg(u,400+900*(1-d/radius));
  });
  miners.forEach(function(m){
    if(m.side===side||m.hp<=0)return;
    var d=Math.hypot(m.x-nx,m.y-ny);
    if(d<radius)dealDmg(m,500+800*(1-d/radius));
  });
  blds.forEach(function(t){
    if(t===null||t.side===side||t.hp<=0)return;
    var d=Math.hypot(t.x-nx,t.y-ny);
    if(d>=radius)return;
    var fall=1-d/radius;
    if(t.type==='hq'){
      var dmg=Math.min(t.hp-1,1100+400*fall);
      if(dmg>0)dealDmg(t,dmg);
    }else if(t.type==='nukesilo'){
      dealDmg(t,600+700*fall);
    }else{
      dealDmg(t,250+700*fall);
    }
  });
}
function updateNukes(){
  if(screenFlash>0)screenFlash=Math.max(0,screenFlash-0.03);
  for(var i=nukeFx.length-1;i>=0;i--){
    nukeFx[i].t++;
    if(nukeFx[i].t>=nukeFx[i].dur)nukeFx.splice(i,1);
  }
  for(var i=nukes.length-1;i>=0;i--){
    var nk=nukes[i];
    nk.t++;
    if(nk.t>=nk.dur){
      nukeExplode(nk.tx,nk.ty,nk.side,nk.radius);
      nukes.splice(i,1);
      continue;
    }
    var pr=nk.t/nk.dur;
    nk.x=nk.sx+(nk.tx-nk.sx)*pr;
    nk.y=nk.sy+(nk.ty-nk.sy)*pr-Math.sin(pr*PI)*120;
    if(nk.t%3===0)parts.push({x:nk.x,y:nk.y,vx:(Math.random()-.5),vy:0.5,life:20,col:'#ccc',sz:3+Math.random()*3});
  }
  blds.forEach(function(b){
    if(b.type!=='nukesilo'||b.hp<=0||!b.ready)return;
    if(!b.nukeCd)b.nukeCd=1800;
    b.nukeCd--;
    if(b.nukeCd<=0){
      b.nukeCd=1800;
      var best=null,bd=99999;
      blds.forEach(function(h){
        if(h.type==='hq'&&h.side!==b.side&&h.hp>0){
          var d=dist(b,h);
          if(d<bd){bd=d;best=h;}
        }
      });
      if(!best){
        var es=units.filter(function(u){return u.side!==b.side&&u.hp>0;});
        if(es.length)best=es[~~(Math.random()*es.length)];
      }
      if(best){
        nukes.push({sx:b.x,sy:b.y,tx:best.x,ty:best.y,side:b.side,t:0,dur:110,radius:340,x:b.x,y:b.y});
        parts.push({x:b.x,y:b.y-30,vx:0,vy:-2,life:40,col:'#f80',sz:10});
      }
    }
  });
}
function heroAura(){
  units.forEach(function(u){
    if(u.type!=='hero'||u.hp<=0||u.riding)return;
    if(u.skillCd>0){u.skillCd--;return;}
    u.skillCd=600;

}

function netSend(o){if(NET.ws&&NET.ws.readyState===1){try{NET.ws.send(JSON.stringify(o));}catch(e){}}}
function netConnect(server,onopen,onfail){
  try{if(NET.ws){NET.ws.onclose=null;NET.ws.close();}}catch(e){}
  var ws; try{ws=new WebSocket(server);}catch(e){onfail&&onfail('地址无效: '+server);return;}
  NET.ws=ws; var done=false;
  var to=setTimeout(function(){if(!done){done=true;try{ws.close();}catch(e){}onfail&&onfail('连接超时：服务器可能正在唤醒，请等1分钟再试');}},12000);
  ws.onopen=function(){done=true;clearTimeout(to);NET.connected=true;try{if(NET.hb)clearInterval(NET.hb);if(NET.pingTimer)clearInterval(NET.pingTimer);}catch(e){}NET.hb=setInterval(function(){netSend({t:'ping'});},8000);NET.pingTimer=setInterval(function(){netSend({t:'ping',ts:Date.now()});},2000);onopen&&onopen();};
  ws.onmessage=function(ev){try{onNetMsg(JSON.parse(ev.data));}catch(e){}};
  ws.onerror=function(){if(!done){done=true;clearTimeout(to);onfail&&onfail('连接失败');}};
  ws.onclose=function(){NET.connected=false;try{if(NET.hb)clearInterval(NET.hb);if(NET.pingTimer)clearInterval(NET.pingTimer);}catch(e){}};
}

function hostStart(){
  if(!NET.isHost)return;
  var list=[],cid;
  for(cid in NET.players)list.push(NET.players[cid]);
  list.sort(function(a,b){return (b.isHost?1:0)-(a.isHost?1:0);});
  var used=[false,false,false,false],assign={};
  for(var i=0;i<list.length;i++){
    var p=list[i],sd=p.side|0; if(sd<0||sd>3)sd=0;
    if(used[sd]){for(var k=0;k<4;k++)if(!used[k]){sd=k;break;}}
    used[sd]=true;assign[p.cid]=sd;p.side=sd;
  }
  humanSide=[used[0],used[1],used[2],used[3]];
  mySide=assign[NET.cid]||0;
  NET.mode='host';NET.started=true;
  genMap();
  netSend({t:'start',v:RA_VER,human:humanSide,sides:assign,
    ais:ais.map(function(a){return a?a.strategy:null;}),
    map:mData,ores:ores.map(function(o){return [o.x,o.y,o.a];}),
    blds:blds.map(function(b){return [b.id,b.side,b.type,b.x,b.y,b.hp,b.mhp,1,b.bt,b.sz,0];}),
    miners:miners.map(function(m){return [m.id,m.side,m.x,m.y,m.hp,m.carry,m.st];}),
    gold:sideGold,weather:weather,gt:gt,mType:mType});
  closeLobby();
}

function onNetMsg(m){
  switch(m.t){
    case 'pong': if(m.ts)NET.ping=Date.now()-m.ts;break;
    case 'err': lbMsg(m.msg||'错误');break;
    case 'created':
      NET.cid=m.cid;NET.isHost=true;
      NET.players[m.cid]={name:NET.name,cid:m.cid,side:NET.desireSide,isHost:true};
      showRoomView();lbRender();break;
    case 'joined':
      NET.cid=m.cid;NET.isHost=false;showRoomView();
      NET.players[m.cid]={name:NET.name,cid:m.cid,side:NET.desireSide,isHost:false};
      lbRender();break;
    case 'joinc':
      if(NET.isHost){NET.players[m.cid]={name:m.name,cid:m.cid,side:m.side|0,isHost:false};lbBroadcast();lbRender();}break;
    case 'leave':
      if(NET.isHost){
        var lv=NET.players[m.cid];
        if(lv&&NET.started){humanSide[lv.side]=false;netSend({t:'lob',k:'left',side:lv.side});}
        delete NET.players[m.cid];lbBroadcast();lbRender();
      }break;
    case 'lob':
      if(NET.isHost){if(m.k==='side'&&NET.players[m.cid]){NET.players[m.cid].side=m.side|0;lbBroadcast();lbRender();}}
      else if(m.k==='roster'){NET.players=m.players||{};lbRender();}
      else if(m.k==='left'){humanSide[m.side]=false;}break;
    case 'start':
      if(!NET.isHost){if(m.v&&m.v!==RA_VER)lbMsg('版本不一致，可能出现异常');guestStart(m);}
      break;
    case 'snap': if(NET.mode==='guest')guestApply(m);break;
    case 'over': if(NET.mode==='guest')guestOver(m);break;
    case 'cmd': if(NET.isHost)hostApplyCmd(m);break;
    case 'hostgone':
      lbMsg('房主已离开，游戏结束');
      gOver=1;document.getElementById('got').textContent='💀 房主离开';document.getElementById('gom').textContent='游戏结束';document.getElementById('gameover').style.display='flex';
      break;
  }
}

function idsOf(us){var a=[];for(var i=0;i<us.length;i++)a.push(us[i].id);return a;}

function apcAt(side,x,y){for(var i=0;i<units.length;i++){var u=units[i];if(u.hp>0&&!u.riding&&u.side===side&&((u.type==='apc'&&Math.abs(u.x-x)<55&&Math.abs(u.y-y)<55)||(u.type==='heli'&&Math.abs(u.x-x)<75&&Math.abs(u.y-y)<75)||(u.water&&Math.abs(u.x-x)<80&&Math.abs(u.y-y)<80)))return u;}return null;}
function setCamFollow(us){
  camFollowId=0;camFollowG=null;
  if(!us||!us.length||us[0].side!==mySide)return;
  if(us.length===1)camFollowId=us[0].id;
  else{var _ids=[];for(var _i=0;_i<us.length;_i++)_ids.push(us[_i].id);camFollowG=_ids;}
}
function applyMove(us,x,y){
  var ap=us.length?apcAt(us[0].side,x,y):null;
  if(ap&&ap.cargo){
    var boarded=0;
    for(var bi=0;bi<us.length;bi++){
      var bu=us[bi];
      if(bu.type==='apc'||bu.type==='heli'||bu.riding||bu._tin)continue;
      var _canLoad=ap.water?true:(bu.type==='rifle'||bu.type==='rocket'||bu.type==='engineer'||bu.type==='tesla'||bu.type==='hero');
      if(_canLoad){
        if(ap.cargo.length+boarded<(ap.cap||4)){bu.ord='load';bu.loadTo=ap.id;bu.tgt=null;bu._path=null;bu.wSide=undefined;boarded++;}
      }
    }
    if(boarded)return;
  }
  us.forEach(function(u,i){var ang=i/us.length*PI*2;var _mtx=x+Math.cos(ang)*15*(i>0?1:0),_mty=y+Math.sin(ang)*15*(i>0?1:0);u.tx=_mtx;u.ty=_mty;u.tgt=null;u.ord='m';u.wSide=undefined;u._stuckN=0;u._wsRest=0;u._pi=0;u._path=(u.water&&!u.fly)?findPathWater(u.x,u.y,u.tx,u.ty):null;});
  setCamFollow(us);
}
function applyAttack(us,tgt){us.forEach(function(s){s.tgt=tgt;s.ord='a';s.tx=undefined;s.ty=undefined;s._path=null;s.wSide=undefined;s._wsRest=0;});setCamFollow(us);}
function applyUnload(a){
  if(!a||a.hp<=0||!a.cargo||!a.cargo.length)return;
  var n=a.cargo.length;
  for(var i=0;i<n;i++){
    var u=a.cargo[i];
    var ang=i/n*PI*2;
    u.x=a.x+Math.cos(ang)*46;u.y=a.y+Math.sin(ang)*46;
    if(a.ar==='air')u._chute=60;if(a.water)u._chute=30;u.riding=0;u._path=null;u.tx=undefined;u.ty=undefined;u.tgt=null;u.ord=null;u.loadTo=undefined;
  }
  Array.prototype.push.apply(units,a.cargo);
  a.cargo.length=0;
}
function unloadApc(a){if(!a)return;if(NET.mode==='guest'){netCmd({k:'unload',a:a.id});return;}applyUnload(a);}
function orderMove(us,x,y){
  var _tnear=null;
  blds.forEach(function(b){if(b.type==='tunnel'&&b._tn==='in'&&b.hp>0&&b.ready&&b.side===us[0].side&&Math.hypot(b.x-x,b.y-y)<b.sz*T/2+40)_tnear=b;});
  if(_tnear){
    var _tout=null;
    for(var ti=0;ti<blds.length;ti++)if(blds[ti].id===_tnear._pair&&blds[ti].hp>0)_tout=blds[ti];
    if(_tout){
      us.forEach(function(u){
        if(u.hp<=0||u.riding||u._tin)return;
        if(Math.hypot(u.x-_tnear.x,u.y-_tnear.y)<250){
          u._tin={fid:_tnear.id,tid:_tout.id,sx:_tnear.x,sy:_tnear.y,p:0};
          u._path=null;u.tx=undefined;u.ty=undefined;u.tgt=null;u.ord=null;
        }else{
          u.tx=_tnear.x;u.ty=_tnear.y;u._path=null;u.tgt=null;u.ord=null;
        }
      });
      parts.push({x:_tnear.x,y:_tnear.y,vx:0,vy:0,life:30,col:'#0f0',sz:10});

    res.ok=!!(res.hasTesla&&res.hasApc&&res.techTeslaLocked&&res.techTeslaAfterLab&&res.rocketFlyFlag&&res.rocketMoved&&res.teslaChain&&res.teslaFarUntouched&&res.apcLoaded&&res.unitsRidden&&res.atkStack&&res.tslaOff&&res.tslaFlag&&res.atkStack2&&res.apcUnloaded&&res.apcEject&&(!_w3||(res.navyPlaced&&res.navySeaSpot===true&&res.navyWaterSpawn&&res.navyPlaneBullets&&res.navyPlaneDmg)));
